<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="애니콜관리자">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2a4a">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Taxi/3D/taxi_3d.png">
<title>애니콜택시 관리자 (모바일)</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Malgun Gothic',sans-serif;background:#f0f2f5;min-height:100vh;font-size:13px}
.topbar{background:#1a2a4a;padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.ch-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:4px 10px;font-size:11px;color:#f5b800;cursor:pointer}
.topbar-title{font-size:14px;font-weight:700;color:#fff;flex:1}
.topbar-time{font-size:10px;color:rgba(255,255,255,0.5)}
.main-tabs{display:flex;background:#0f1d36;position:sticky;top:44px;z-index:99}
.main-tab{flex:1;padding:10px 4px;font-size:12px;color:rgba(255,255,255,0.4);text-align:center;border-bottom:2px solid transparent;cursor:pointer;transition:all 0.2s}
.main-tab.on{color:#f5b800;border-bottom-color:#f5b800}
.section{display:none}
.section.on{display:block}

/* 필터행 */
.filter-row{display:flex;gap:6px;padding:8px;background:#fff;border-bottom:1px solid #eee}
.f-date{padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:12px;background:#f9f9f9}
.f-search{flex:1;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:12px;background:#f9f9f9}

/* 카드 목록 */
.card-list{padding:8px}
.card-item{background:#fff;border:1px solid #e0e0e0;border-radius:10px;margin-bottom:8px;padding:10px 12px;cursor:pointer;transition:all 0.15s}
.card-item.urgent{border-left:4px solid #E24B4A}
.card-item.tomorrow{border-left:4px solid #EF9F27}
.card-item.selected{border-color:#1a2a4a;background:#eef2ff}
.ci-title{font-size:12px;font-weight:700;color:#1a2a4a;margin-bottom:3px}
.ci-sub{font-size:11px;color:#888}
.ci-driver{font-size:11px;color:#2e7d32;font-weight:700}
.ci-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;margin-left:4px}
.badge-red{background:#FCEBEB;color:#A32D2D}
.badge-amber{background:#FAEEDA;color:#854F0B}
.badge-green{background:#EAF3DE;color:#3B6D11}
.badge-gray{background:#F1EFE8;color:#5F5E5A}
.empty{text-align:center;padding:40px 0;color:#ccc;font-size:13px}

/* 콜카드 뷰 */
.card-view-wrap{margin:0 8px 8px}
.card-view-body{background:#f9f9f9;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:12px;line-height:1.8;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.action-btn{padding:13px 8px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;border:1px solid #ddd;background:#fff;color:#333}
.action-btn.primary{background:#1a2a4a;color:#f5b800;border-color:#1a2a4a}
.action-btn.yellow{background:#f5b800;color:#1a2a4a;border-color:#f5b800}
.action-btn.danger{background:#FCEBEB;color:#A32D2D;border-color:#F7C1C1}
.action-btn.full{grid-column:1/-1}

/* 당일배차 3버튼 */
.btn3-row{display:flex;gap:6px;padding:8px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:88px;z-index:98}
.btn3{flex:1;padding:10px 4px;border-radius:8px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:1px solid #ddd;background:#fff;color:#666;line-height:1.4}
.btn3.on{background:#1a2a4a;color:#f5b800;border-color:#1a2a4a}
.sub-section{display:none}
.sub-section.on{display:block}

/* 리스트생성+매칭 */
.box-body{padding:10px}
.row-filter{display:flex;gap:5px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.num-input{width:50px;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:12px;text-align:center}
.btn-sm{padding:6px 10px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.btn-dark{background:#1a2a4a;color:#f5b800}
.btn-green{background:#2e7d32;color:#fff}
.list-preview{background:#f9f9f9;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:11px;line-height:1.8;height:200px;margin-bottom:8px;white-space:pre-wrap;color:#333;overflow-y:auto;resize:none}
.share-row{display:flex;gap:6px;margin-bottom:8px}
.share-btn{flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:none}
.share-mid{background:#E6F1FB;color:#185FA5}
.share-lg{background:#F3E5F5;color:#6a1b9a}
.match-ta{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:12px;font-family:'Malgun Gothic',sans-serif;resize:none;height:80px;margin-bottom:8px}
.match-row{display:flex;gap:6px}
.btn-match{flex:1;padding:9px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;background:#1a2a4a;color:#f5b800}
.btn-reset{flex:0 0 auto;padding:9px 14px;border:1px solid #ddd;border-radius:8px;font-size:12px;cursor:pointer;background:#f9f9f9;color:#666}

/* 매칭완료+정보전달 */
.info-card-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer;background:#fff}
.info-card-item.sel{background:#eef2ff}
.ici-title{flex:1;font-size:12px;font-weight:700;color:#1a2a4a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ici-driver{font-size:11px;color:#2e7d32;font-weight:700;flex-shrink:0}
.bot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.bot-box{border:1px solid #ddd;border-radius:8px;overflow:hidden}
.bot-title{font-size:11px;font-weight:700;padding:6px 10px;background:#f0f0f0;color:#555}
.bot-content{font-size:11px;padding:8px 10px;line-height:1.6;min-height:60px;white-space:pre-wrap;word-break:break-all}
.bot-action{padding:6px 8px;border-top:1px solid #eee;display:flex;gap:6px}
.bot-btn{flex:1;padding:6px;border-radius:6px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:none}
.bot-share{background:#f5b800;color:#1a2a4a}
.bot-copy{background:#f0f0f0;color:#555}
.bot-btn.dis{opacity:0.35;cursor:not-allowed}
.done-wrap{padding:10px}
.done-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:#2e7d32;color:#fff}
.done-btn.dis{opacity:0.35;cursor:not-allowed}
.done-note{text-align:center;font-size:11px;color:#999;margin-top:5px}

/* 팝업 */
.popup-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center}
.popup-bg.show{display:flex}
.popup{background:#fff;border-radius:14px;padding:20px;width:88%;max-width:360px}
.popup-title{font-size:15px;font-weight:700;color:#1a2a4a;margin-bottom:14px}
.popup input,.popup textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:'Malgun Gothic',sans-serif;margin-bottom:10px}
.popup textarea{height:120px;resize:none}
.popup-btns{display:flex;gap:8px}
.popup-btn{flex:1;padding:11px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.popup-ok{background:#1a2a4a;color:#f5b800}
.popup-cancel{background:#f0f0f0;color:#555}
/* 사이드바 */
.split-wrap{display:flex;height:calc(100vh - 195px);min-height:420px}
.sidebar{width:54px;background:#fff;border-right:1px solid #eee;overflow-y:auto;flex-shrink:0;height:100%}
.sb-item{padding:4px 3px;border-bottom:1px solid #f5f5f5;font-size:9px;color:#aaa;overflow:hidden;white-space:nowrap;cursor:pointer;line-height:1.4;text-align:center}
.sb-item.numbered{color:#1a2a4a;font-weight:700}
.sb-item.urgent-s{border-left:2px solid #E24B4A}
.sb-item.tomorrow-s{border-left:2px solid #EF9F27}
.sb-item.sel-s{background:#eef2ff}
.main-content{flex:1;overflow-y:auto;min-width:0}
.popup-full{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:200;flex-direction:column}
.popup-full.show{display:flex}
.popup-full-head{background:#1a2a4a;padding:12px 14px;display:flex;align-items:center;gap:10px}
.popup-full-title{font-size:15px;font-weight:700;color:#f5b800;flex:1}
.popup-full-body{flex:1;display:flex;flex-direction:column;padding:12px}
.popup-full-body textarea{flex:1;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:'Malgun Gothic',sans-serif;resize:none;line-height:1.8}
.popup-full-btns{display:flex;gap:8px;padding:12px}
</style>
</head>
<body>

<div class="topbar">
  <button class="ch-btn" onclick="alert('채널 선택 기능 준비 중')">채널 선택</button>
  <div class="topbar-title">애니콜택시 관리자</div>
  <div class="topbar-time" id="clock"></div>
</div>

<div class="main-tabs">
  <div class="main-tab on" onclick="switchTab(0)">확정대기<br><span id="cnt0" style="font-size:10px">0</span></div>
  <div class="main-tab" onclick="switchTab(1)">당일배차<br><span id="cnt1" style="font-size:10px">0</span></div>
  <div class="main-tab" onclick="switchTab(2)">배차완료<br><span id="cnt2" style="font-size:10px">0</span></div>
</div>

<!-- ① 확정대기 -->
<div class="section on" id="sec0">
  <div class="filter-row" style="flex-wrap:wrap;gap:6px">
    <div style="display:flex;gap:5px;width:100%">
      <button id="wait-btn-new" onclick="setWaitMode('new')" style="flex:1;padding:7px;border-radius:7px;font-size:12px;font-weight:700;border:none;background:#1a2a4a;color:#f5b800;cursor:pointer">최신</button>
      <button id="wait-btn-old" onclick="setWaitMode('old')" style="flex:1;padding:7px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer">오래된거</button>
    </div>
    <input class="f-search" type="text" placeholder="🔍 예약번호 / 이름 / 전화번호" oninput="onSearchWait(this.value)" style="width:100%">
  </div>
  <div id="wait-list" class="card-list"></div>
  <div id="wait-card-view" style="display:none">
    <div class="card-view-wrap">
      <div class="card-view-body" id="wait-card-body" style="max-height:300px"></div>
    </div>
    <div id="wait-dup-view"></div>
    <div class="action-grid">
      <div class="action-btn" onclick="openNickPopup()">손님카톡닉 입력</div>
      <div class="action-btn" onclick="openEditPopup('wait')">카드수정</div>
      <div class="action-btn primary" onclick="doConfirmWait()">예약확정</div>
      <div class="action-btn yellow" onclick="goBarobaecha()">바로배차</div>
    </div>
  </div>
</div>

<!-- ② 당일배차 -->
<div class="section" id="sec1">
  <div class="btn3-row">
    <div class="btn3 on" id="btn3-0" onclick="switchSub(0)">리스트생성<br>+매칭</div>
    <div class="btn3" id="btn3-1" onclick="switchSub(1)">매칭완료<br>+정보전달</div>
    <div class="btn3" id="btn3-2" onclick="switchSub(2)">수정/<br>예약취소</div>
  </div>
  <div class="split-wrap">
    <!-- 사이드바 -->
    <div class="sidebar" id="dispatch-sidebar"></div>

    <!-- 메인 콘텐츠 -->
    <div class="main-content">

  <!-- 리스트생성+매칭 -->
  <div class="sub-section on" id="sub0">
    <div class="box-body">
      <div class="row-filter">
        <input type="date" id="m-date" class="f-date" style="font-size:12px" onchange="onMDateChange();renderSidebar()">
        <span style="font-size:11px;color:#888">시작번호</span>
        <input type="number" class="num-input" id="m-startnum" value="31" min="1">
        <button class="btn-sm btn-dark" onclick="doMNumbering()">넘버링</button>
        <button class="btn-sm btn-green" onclick="doMGenList()">리스트생성</button>
      </div>
      <textarea class="list-preview" id="m-list-preview" style="width:100%;resize:none;font-family:'Malgun Gothic',sans-serif;outline:none">리스트 생성 후 표시됩니다</textarea>
      <div class="share-row">
        <button class="share-btn share-mid" onclick="shareList('mid')">중형 공유</button>
        <button class="share-btn share-lg" onclick="shareList('lg')">대형/콜밴 공유</button>
        <button class="share-btn" style="background:#EAF3DE;color:#3B6D11" onclick="shareList('num')">번호 공유</button>
      </div>
      <textarea class="match-ta" id="m-match-ta" placeholder="31. 김종희&#10;32. 조재현&#10;33. 홍기조&#10;..."></textarea>
      <div class="match-row">
        <button class="btn-match" onclick="doMAutoMatch()">자동 매칭</button>
        <button class="btn-reset" onclick="doMResetMatch()">↩ 되돌리기</button>
      </div>
    </div>
  </div>

  <!-- 매칭완료+정보전달 -->
  <div class="sub-section" id="sub1">
    <div id="info-card-list"></div>
    <div id="info-card-detail" style="display:none">
      <div style="padding:8px 10px;font-size:12px;font-weight:700;color:#1a2a4a;border-bottom:1px solid #eee;background:#fff" id="info-sel-title"></div>
      <div class="bot-grid">
        <div class="bot-box">
          <div class="bot-title">콜카드</div>
          <div class="bot-content" id="info-colcard">카드 선택 후</div>
          <div class="bot-action">
            <button class="bot-btn bot-share dis" id="btn-colcard-share" onclick="shareColcard()">공유</button>
            <button class="bot-btn bot-copy dis" id="btn-colcard-copy" onclick="copyColcard()">복사</button>
          </div>
        </div>
        <div class="bot-box">
          <div class="bot-title">기사정보</div>
          <div class="bot-content" id="info-driver">카드 선택 후</div>
          <div class="bot-action">
            <button class="bot-btn bot-copy dis" id="btn-driver-copy" onclick="copyDriverInfo()">복사</button>
            <button class="bot-btn bot-share dis" id="btn-driver-paste" onclick="openDriverPastePopup()" style="background:#e8f5e9;color:#2e7d32">기사정보 입력</button>
          </div>
        </div>
      </div>
      <div class="done-wrap">
        <button class="done-btn dis" id="info-done-btn" onclick="doInfoDone()">배차완료</button>
        <div class="done-note">콜카드 + 기사정보 완료 시 활성화</div>
      </div>
    </div>
  </div>

  <!-- 수정/예약취소 -->
  <div class="sub-section" id="sub2">
    <div class="filter-row">
      <input type="date" class="f-date" id="edit-date" onchange="editSelected=null;renderEditList()">
      <input class="f-search" type="text" placeholder="🔍 검색" oninput="onSearchEdit(this.value)">
    </div>
    <div id="edit-card-list" class="card-list"></div>
    <div id="edit-card-view" style="display:none">
      <div class="card-view-wrap">
        <div class="card-view-body" id="edit-card-body"></div>
      </div>
      <div class="action-grid">
        <div class="action-btn primary" onclick="openEditPopup('dispatch')">카드 수정</div>
        <div class="action-btn danger" onclick="doCancelCard()">예약 취소</div>
      </div>
    </div>
  </div>

    </div><!-- end main-content -->
  </div><!-- end split-wrap -->
</div>

<!-- ③ 배차완료 -->
<div class="section" id="sec2">
  <div class="filter-row">
    <input type="date" class="f-date" id="comp-date" onchange="renderCompList()">
    <input class="f-search" type="text" placeholder="🔍 검색" oninput="onSearchComp(this.value)">
  </div>
  <div id="comp-card-list" class="card-list"></div>
  <div id="comp-card-view" style="display:none"></div>
  <!-- 재배차 화면 -->
  <div id="reb-view" style="display:none">
    <div class="card-view-wrap">
      <div class="card-view-body" id="reb-card-body"></div>
    </div>
    <div class="action-grid">
      <div class="action-btn primary" onclick="openEditPopup('reb')">카드 수정</div>
      <div class="action-btn yellow" onclick="goBarobaechaReb()">재배차</div>
    </div>
  </div>
</div>

<!-- 바로배차 화면 (전체화면) -->
<div id="baro-screen" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#f0f2f5;z-index:150;display:none;flex-direction:column">
  <div class="topbar">
    <button class="ch-btn" onclick="closeBaroScreen()">← 뒤로</button>
    <div class="topbar-title" id="baro-title"></div>
    <div class="ci-badge badge-red" id="baro-nick" style="font-size:11px;padding:4px 8px"></div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:8px;padding-bottom:70px">
    <div class="btn3-row" style="position:relative;top:0;padding:0;margin-bottom:8px">
      <div class="btn3 on" id="baro-tab0" onclick="switchBaroTab(0)">배차리스트</div>
      <div class="btn3" id="baro-tab1" onclick="switchBaroTab(1)">급좌표</div>
    </div>
    <div id="baro-list-box" style="background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center">
      <div style="flex:1;font-size:11px;color:#555;line-height:1.7" id="baro-list-preview">리스트 생성 중...</div>
      <button style="padding:8px 12px;background:#f5b800;border:none;border-radius:8px;font-size:11px;font-weight:700;color:#1a2a4a;cursor:pointer;white-space:nowrap" onclick="shareBaroList()">공유</button>
    </div>
    <div style="background:#fff;border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="display:grid;grid-template-columns:100px auto 1fr auto;gap:6px;align-items:start">
        <input type="text" id="baro-drv-name" placeholder="기사 이름" style="padding:7px;border:1px solid #ddd;border-radius:8px;font-size:12px;font-family:'Malgun Gothic',sans-serif">
        <button class="btn-sm btn-dark" onclick="doBaroMatch()" style="white-space:nowrap;height:36px">매칭</button>
        <textarea id="baro-drv-paste" placeholder="기사정보 붙여넣기" style="padding:7px;border:1px solid #ddd;border-radius:8px;font-size:11px;font-family:'Malgun Gothic',sans-serif;resize:none;height:60px"></textarea>
        <button class="btn-sm btn-dark" onclick="doBaroMatchPaste()" style="white-space:nowrap;height:36px">매칭</button>
      </div>
    </div>
    <div class="bot-grid" style="padding:0;margin-bottom:8px">
      <div class="bot-box">
        <div class="bot-title">콜카드</div>
        <div class="bot-content" id="baro-colcard-content" style="max-height:300px;overflow-y:auto;min-height:120px">-</div>
        <div class="bot-action">
          <button class="bot-btn bot-share dis" id="baro-btn-share" onclick="shareBaroColcard()">공유</button>
          <button class="bot-btn bot-copy dis" id="baro-btn-copy" onclick="copyBaroColcard()">복사</button>
        </div>
      </div>
      <div class="bot-box">
        <div class="bot-title">기사정보</div>
        <div class="bot-content" id="baro-driver-content">기사 매칭 후</div>
        <div class="bot-action">
          <button class="bot-btn bot-copy dis" id="baro-btn-drvcp" onclick="copyBaroDriver()">복사</button>
        </div>
      </div>
    </div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyAYaOtA5ztXwUz-ZfSyQAvUt65Oe-GvmWE",
  authDomain: "anicall-taxi.firebaseapp.com",
  databaseURL: "https://anicall-taxi-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "anicall-taxi",
  storageBucket: "anicall-taxi.firebasestorage.app",
  messagingSenderId: "1043913713685",
  appId: "1:1043913713685:web:e1ee0e61fd3f3f2332461c"
};

var db, allData = [], allDrivers = [], driverMap = {};
var currentTab = 0, currentSub = 0, currentBaroTab = 0;
var waitSearch = '', editSearch = '', compSearch = '';
var waitMode = 'new';
function setWaitMode(mode){
  waitMode=mode; waitSelected=null;
  document.getElementById('wait-btn-new').style.cssText='flex:1;padding:7px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;background:'+(mode==='new'?'#1a2a4a':'#fff')+';color:'+(mode==='new'?'#f5b800':'#666');
  document.getElementById('wait-btn-old').style.cssText='flex:1;padding:7px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:'+(mode==='old'?'none':'1px solid #ddd')+';background:'+(mode==='old'?'#1a2a4a':'#fff')+';color:'+(mode==='old'?'#f5b800':'#666');
  renderWait();
}
var waitSelected = null, editSelected = null, compSelected = null, infoSelected = null;
var mListText = '', mListLarge = '', mListHeader = '', mMatchBackup = {}, mListLocked = {};
var baroCard = null, baroIsReb = false;
var baroListShared = false, baroColcardDone = false, baroDriverDone = false;
var infoListShared = false, infoColcardDone = {}, infoDriverDone = {};
var _infoPopupShowing = false;
var editContext = 'wait';
var editDateFilter = '', compDateFilter = '';
var _searchTimer = null;

function p2(n){ return n<10?'0'+n:''+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cardLabel(r){ return r.title1||r.resNum||'(카드)'; }
function getWarnings(r){
  var warns=[], tail=r.tail||'';
  tail.split('\n').forEach(function(line){ var t=line.trim(); if(t.indexOf('⚠️')===0||t.indexOf('❗')===0) warns.push(t); });
  return warns;
}
function colcardText(r){
  return r.body || r.tail || '';
}
// driverMap(로컬) 또는 Firebase(driverName 등) 중 있는 값 반환 (PC와 동기화)
function getDriverInfo(r){
  var dm=driverMap[r.id]||{};
  return {
    driver: dm.driver || r.driverName || '',
    phone: dm.phone || r.driverPhone || '',
    vehicle: dm.vehicle || r.driverVehicleType || '',
    vehicleNum: dm.vehicleNum || r.driverVehicleNum || ''
  };
}
function copyText(text, label){
  var el=document.createElement('textarea'); el.value=text;
  el.style.cssText='position:fixed;top:-9999px'; document.body.appendChild(el);
  el.select(); try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(el);
  if(label) alert('✅ '+label+' 복사됐어요!');
}
function shareText(text){
  if(navigator.share){ navigator.share({text:text}).catch(function(){}); }
  else{ copyText(text,''); alert('✅ 클립보드에 복사됐어요!'); }
}

// 시계
function updateClock(){ var d=new Date(); document.getElementById('clock').textContent=p2(d.getHours())+':'+p2(d.getMinutes()); }
setInterval(updateClock,1000); updateClock();

// Firebase
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  db.ref('cards').on('value', function(snap){
    var data = snap.val()||{};
    checkNewCard(data);
    allData = [];
    snap.forEach(function(child){ allData.push(Object.assign({id:child.key}, child.val())); });
    updateCounts(); render();
  });
  db.ref('drivers').on('value', function(snap){
    allDrivers = [];
    snap.forEach(function(child){ allDrivers.push(Object.assign({id:child.key}, child.val())); });
  });
  db.ref('driverMap').on('value', function(snap){
    driverMap = snap.val()||{};
    renderSidebar();
  });
}catch(e){ alert('Firebase 연결 실패: '+e.message); }

function updateCounts(){
  var c=[0,0,0];
  allData.forEach(function(r){
    if(r.status==='대기'||r.status==='대기_오래됨') c[0]++;
    else if(r.status==='확정') c[1]++;
    else if(r.status==='배차완료'||r.status==='재배차완료') c[2]++;
  });
  ['cnt0','cnt1','cnt2'].forEach(function(id,i){ var el=document.getElementById(id); if(el) el.textContent=c[i]; });
}

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.main-tab').forEach(function(el,i){ el.classList.toggle('on',i===t); });
  document.querySelectorAll('.section').forEach(function(el,i){ el.classList.toggle('on',i===t); });
  render();
}

function renderSidebar(){
  var sb=document.getElementById('dispatch-sidebar');
  if(!sb) return;
  if(currentSub!==0){
    sb.style.display='none';
    sb.style.width='0';
    sb.style.borderRight='none';
    return;
  }
  sb.style.display='block';
  sb.style.width='54px';
  sb.style.borderRight='1px solid #eee';
  var dateV=document.getElementById('m-date').value;
  var list=allData.filter(function(r){ 
    return r.status==='확정'&&(!dateV||r.rideDate===dateV);
  })
    .sort(function(a,b){ return (a.baechaNum||999)-(b.baechaNum||999)||(a.rideHHMM||'').localeCompare(b.rideHHMM||''); });
  var h='<div style="padding:3px 2px;font-size:8px;color:#aaa;text-align:center;border-bottom:1px solid #eee;background:#f9f9f9;position:sticky;top:0">카드</div>';
  list.forEach(function(r){
    var di=getDriverInfo(r);
    var hasDriver=!!(di.driver);
    // 기사 배정된 카드는 사이드바에서 숨김
    if(hasDriver) return;
    var tail=r.tail||'';
    var isUrgent=tail.indexOf('❗❗ 당일')>=0||tail.indexOf('❗❗❗')>=0;
    var isTomorrow=tail.indexOf('❗❗ 내일')>=0;
    var t1=r.title1||'', t1p=t1.split(' ');
    var veh=t1p[0]||'', dir=t1p[1]||'', loc=t1p[2]||'';
    var warns=getWarnings(r);
    var warnMark=warns.some(function(w){ return w.indexOf('❗❗')>=0||w.indexOf('❗❗❗')>=0; })?'<span style="color:#E24B4A">❗</span>':warns.length?'<span style="color:#EF9F27">⚠</span>':'';
    // 번호 없으면 미배차 표시
    var numLabel=r.baechaNum?r.baechaNum+'<br>':'<span style="color:#e53935;font-size:8px">미배차</span><br>';
    var label=numLabel+(warnMark?warnMark+'<br>':'')+(veh+dir)+'<br>'+loc.slice(0,2);
    var cls='sb-item'+(r.baechaNum?' numbered':'')+(isUrgent?' urgent-s':isTomorrow?' tomorrow-s':'');
    h+='<div class="'+cls+'" onclick="jumpToCard(\''+r.id+'\')">'+label+'</div>';
  });
  sb.innerHTML=h;
}

function jumpToCard(id){
  var r=allData.find(function(x){ return x.id===id; });
  if(!r) return;
  var text=colcardText(r);
  var pop=document.getElementById('popup-colcard-view');
  document.getElementById('popup-colcard-body').textContent=text;
  pop.classList.add('show');
}

function switchSub(s){
  currentSub=s;
  // 매칭 입력란 항상 초기화
  var mta=document.getElementById('m-match-ta'); if(mta) mta.value='';
  document.querySelectorAll('.btn3').forEach(function(el,i){ el.classList.toggle('on',i===s); });
  document.querySelectorAll('.sub-section').forEach(function(el,i){ el.classList.toggle('on',i===s); });
  renderSidebar();
  render();
}

function render(){
  updateCounts();
  if(currentTab===0) renderWait();
  else if(currentTab===1){
    renderSidebar();
    if(currentSub===0) {} // 리스트생성 UI 유지
    else if(currentSub===1) renderInfoList();
    else if(currentSub===2) renderEditList();
  }
  else if(currentTab===2) renderCompList();
}

// ───────────────────────────────────────
// 당일배차 콜카드 목록
// ───────────────────────────────────────
var dispatchSearch='', dispatchSelected=null;
function onSearchDispatch(v){ dispatchSearch=v; dispatchSelected=null; renderDispatchList(); }
function renderDispatchList(){
  var dateV=document.getElementById('dispatch-date').value;
  var q=dispatchSearch.toLowerCase(), qClean=q.replace(/[-\s]/g,'');
  var list=allData.filter(function(r){
    if(r.status!=='확정') return false;
    if(dateV&&r.rideDate!==dateV) return false;
    if(!q) return true;
    return (r.resNum||'').toLowerCase().includes(q)||(r.name||'').toLowerCase().includes(q)||
           (r.phone||'').replace(/[-\s]/g,'').includes(qClean)||(r.title1||'').toLowerCase().includes(q)||
           (r.driverName||'').toLowerCase().includes(q);
  }).sort(function(a,b){ return (a.rideHHMM||'').localeCompare(b.rideHHMM||''); });
  var h='';
  if(!list.length) h='<div class="empty">카드 없음</div>';
  list.forEach(function(r){
    var tail=r.tail||'';
    var warns=getWarnings(r);
    var hasRedWarn=tail.indexOf('❗❗')>=0||tail.indexOf('❗❗❗')>=0||warns.some(function(w){return w.indexOf('❗❗')>=0;});
    var hasYellowWarn=!hasRedWarn&&(tail.indexOf('⚠️')>=0||warns.length>0);
    var warnIcon=hasRedWarn?'<span style="color:#E24B4A;font-weight:700">❗❗ </span>':hasYellowWarn?'<span style="color:#EF9F27">⚠️ </span>':'';
    var isUrgent=tail.indexOf('❗❗ 당일')>=0||tail.indexOf('❗❗❗')>=0;
    var isTomorrow=tail.indexOf('❗❗ 내일')>=0;
    var di=getDriverInfo(r);
    var sel=dispatchSelected&&dispatchSelected.id===r.id;
    h+='<div class="card-item'+(isUrgent?' urgent':isTomorrow?' tomorrow':'')+(sel?' selected':'')+'" onclick="selectDispatchCard(\''+r.id+'\')">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">';
    h+='<div class="ci-title" style="flex:1">'+warnIcon+(r.baechaNum?r.baechaNum+'. ':'')+esc(cardLabel(r))+'</div>';
    if(di.driver) h+='<div class="ci-driver">'+esc(di.driver)+'</div>';
    h+='</div>';
    h+='<div class="ci-sub">';
    h+='<span style="color:#185FA5;font-weight:700">'+esc(r.name||'')+'</span>';
    if(r.resNum) h+=' <span style="color:#888">· '+esc(r.resNum)+'</span>';
    h+='</div>';
    h+='</div>';
  });
  document.getElementById('dispatch-card-list').innerHTML=h;
  document.getElementById('dispatch-card-view').style.display=dispatchSelected?'block':'none';
  if(dispatchSelected) document.getElementById('dispatch-card-body').textContent=colcardText(dispatchSelected);
}
function selectDispatchCard(id){
  dispatchSelected=allData.find(function(x){ return x.id===id; })||null;
  renderDispatchList();
  if(dispatchSelected) document.getElementById('dispatch-card-view').scrollIntoView({behavior:'smooth'});
}

// ───────────────────────────────────────
// 확정대기
// ───────────────────────────────────────
function onSearchWait(v){
  clearTimeout(_searchTimer);
  waitSearch=v;
  _searchTimer=setTimeout(function(){ waitSelected=null; renderWait(); },300);
}

var dupCardA='', dupCardB='';
function openDupPopup(idA, idB){
  dupCardA=idA; dupCardB=idB;
  var a=allData.find(function(x){ return x.id===idA; });
  var b=allData.find(function(x){ return x.id===idB; });
  document.getElementById('dup-card-a').textContent=a?colcardText(a):'';
  document.getElementById('dup-card-b').textContent=b?colcardText(b):'';
  document.getElementById('popup-dup').classList.add('show');
}
function deleteDupFromPopup(which){
  var id=which==='a'?dupCardA:dupCardB;
  if(!confirm('이 카드를 삭제할까요?')) return;
  db.ref('cards/'+id).remove().then(function(){
    closePopup('popup-dup');
    waitSelected=null;
  });
}
function deleteDup(id){
  if(!confirm('중복카드를 삭제할까요?')) return;
  db.ref('cards/'+id).remove();
}

function getDups(r){
  if(!r.resNum) return [];
  return allData.filter(function(x){
    return x.resNum===r.resNum&&(x.name||'')===(r.name||'')&&x.id!==r.id&&(x.status==='대기'||x.status==='대기_오래됨');
  }).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
}

function renderWait(){
  var q=waitSearch.toLowerCase();
  var qClean=q.replace(/[-\s]/g,'');
  var list=allData.filter(function(r){
    var statusOk = q ? (r.status==='대기'||r.status==='대기_오래됨') : (waitMode==='new'?r.status==='대기':r.status==='대기_오래됨');
    if(!statusOk) return false;
    if(!q) return true;
    return (r.resNum||'').toLowerCase().includes(q)||
           (r.name||'').toLowerCase().includes(q)||
           (r.phone||'').replace(/[-\s]/g,'').includes(qClean)||
           (r.title1||'').toLowerCase().includes(q);
  }).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  var h='';
  if(!list.length){ h='<div class="empty">카드 없음</div>'; }
  list.forEach(function(r){
    var tail=r.tail||'';
    var warns=getWarnings(r);
    var warnStr=warns.length?'<span style="color:#E24B4A;font-size:12px">'+esc(warns.join(' '))+'</span><br>':'';
    var isUrgent=tail.indexOf('❗❗ 당일')>=0||tail.indexOf('❗❗❗')>=0;
    var isTomorrow=tail.indexOf('❗❗ 내일')>=0;
    var dups=getDups(r);
    var dupBadge=dups.length?'<span style="background:#E24B4A;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:4px">🔴 중복</span>':'';
    var cls='card-item'+(isUrgent?' urgent':isTomorrow?' tomorrow':'')+(waitSelected&&waitSelected.id===r.id?' selected':'');
    h+='<div class="'+cls+'" onclick="selectWaitCard(\''+r.id+'\')">';
    h+='<div class="ci-title" style="display:flex;align-items:center;flex-wrap:wrap">'+warnStr+esc(cardLabel(r))+dupBadge+'</div>';
    h+='<div class="ci-sub"><span style="color:#185FA5;font-weight:700">'+esc(r.name||'')+'</span>'+(r.resNum?' <span style="color:#888">· '+esc(r.resNum)+'</span>':'')+'</div>';
    h+='</div>';
  });
  document.getElementById('wait-list').innerHTML=h;

  // 카드뷰 아래 중복카드 표시
  document.getElementById('wait-card-view').style.display=waitSelected?'block':'none';
  if(waitSelected){
    document.getElementById('wait-card-body').textContent=colcardText(waitSelected);
    var dups2=getDups(waitSelected);

function saveNick(){
  if(!waitSelected) return;
  var nick=document.getElementById('nick-input').value.trim();
  if(!nick){ alert('닉네임을 입력해주세요!'); return; }

  // 꼬리 2줄째 채널>애니>닉네임 으로 업데이트
  var oldTitle2 = waitSelected.title2||'';
  var parts = oldTitle2.split('>');
  var newTitle2 = '';
  if(parts.length >= 2){
    newTitle2 = parts[0]+'>'+parts[1]+'>'+nick;
  } else {
    newTitle2 = oldTitle2 ? oldTitle2+'>'+nick : nick;
  }
  var oldTitle1 = waitSelected.title1||'';
  var oldTail = waitSelected.tail||'';
  var oldTailLines = oldTail.split('\n');
  // title1 위치 찾아서 바로 다음 줄을 title2로 교체
  var t1idx = oldTailLines.findIndex(function(l){ return l.trim()===oldTitle1.trim(); });
  if(t1idx >= 0 && t1idx+1 < oldTailLines.length){
    oldTailLines[t1idx+1] = newTitle2;
  } else if(t1idx >= 0){
    oldTailLines.push(newTitle2);
  }
  var newTail = oldTailLines.join('\n');

  // body에서 old tail 제거하고 new tail로 교체
  var oldBody = waitSelected.body||'';
  var newBody = oldBody;
  if(oldBody.startsWith(oldTail)){
    newBody = newTail + oldBody.slice(oldTail.length);
  }

  db.ref('cards/'+waitSelected.id).update({
    kakaoNick: nick,
    title2: newTitle2,
    tail: newTail,
    body: newBody
  }).then(function(){
    waitSelected.kakaoNick = nick;
    waitSelected.title2 = newTitle2;
    waitSelected.tail = newTail;
    waitSelected.body = newBody;
    closePopup('popup-nick');
    renderWait();
  });
}

function autoUpperEdit(el){
  var pos=el.selectionStart;
  var val=el.value;
  // 영문자만 대문자로 변환 (한글/숫자/특수문자 유지)

  if(newVal!==val){
    el.value=newVal;
    el.selectionStart=el.selectionEnd=pos;
  }

function saveEdit(){
  var ctx=editContext;
  var card=ctx==='wait'?waitSelected:ctx==='dispatch'?editSelected:ctx==='reb'?baroCard:compSelected;
  if(!card) return;
  var newFull=document.getElementById('edit-input').value.trim();
  if(!newFull) return;

  if(!confirm('꼬리도 수정하셨나요?\n\n확인 → 저장\n취소 → 다시 확인')) return;

  var lines=newFull.split('\n');
  // 앞 5줄 이내에서 중/대/콜/쏠 시작 줄 위치 찾기
  var t1idx=lines.slice(0,5).findIndex(function(l){ return /^[중대콜쏠]/.test(l.trim()); });
  if(t1idx<0) t1idx=0;
  var newTitle1=lines[t1idx]?lines[t1idx].trim():'';
  var newTitle2=lines[t1idx+1]?lines[t1idx+1].trim():'';
  // 경고줄 + title1 + title2 = 완전한 tail
  var warnLines=lines.slice(0,t1idx).map(function(l){ return l.trim(); }).filter(Boolean);
  var newTail=warnLines.concat([newTitle1,newTitle2]).filter(Boolean).join('\n');

  // 수정된 title1에서 날짜 재파싱 → rideDate 업데이트 (날짜 바뀌면 해당 날짜방으로 이동)
  var _tp=newTitle1.split(' ');
  var _yy=_tp[3]||'', _mmdd=_tp[4]||'';
  var _newRideDate='';
  if(_yy.length===2 && _mmdd.length===4){
    _newRideDate='20'+_yy+'-'+_mmdd.slice(0,2)+'-'+_mmdd.slice(2);
  }

  var _upd={ body:newFull, tail:newTail, title1:newTitle1, title2:newTitle2 };
  if(_newRideDate) _upd.rideDate=_newRideDate;
  db.ref('cards/'+card.id).update(_upd).then(function(){
    // allData 즉시 업데이트
    var idx=allData.findIndex(function(r){ return r.id===card.id; });
    if(idx>=0){
      allData[idx].body=newFull; allData[idx].tail=newTail;
      allData[idx].title1=newTitle1; allData[idx].title2=newTitle2;
      if(_newRideDate) allData[idx].rideDate=_newRideDate;
    }
    card.body=newFull; card.tail=newTail; card.title1=newTitle1; card.title2=newTitle2;
    if(_newRideDate) card.rideDate=_newRideDate;
    closePopup('popup-edit');
    alert('✅ 수정됐어요!');
    editSelected=null;
    render();
  });
}

      var t1=bodyLines.slice(0,5).find(function(l){ return /^[중대콜쏠]/.test(l.trim()); })||r.title1||'';
      var t1p=t1.split(' ');
      var veh=t1p[0]||'';
      var isLg=(veh==='대'||veh==='콜'||veh==='쏠');
      var vehLabel=veh==='대'?'대형':veh==='콜'?'콜밴':veh==='쏠'?'쏠라티':'';
      var t1lower=t1.toLowerCase();
      // 앞 6개 토큰(차종/방향/지역/26/날짜/시간) 제외한 나머지 키워드 전부 표시
      var extras=t1p.slice(6).join(' ');
      var dtype=t1lower.indexOf('g우선')>=0?'G우선':t1lower.indexOf('eq배차')>=0?'EQ배차':t1lower.indexOf('gqe')>=0?'GQE':'';
      var body=r.body||'', confMatch=body.match(/확정\s*[\d,]+원|확정\s*\d+만/);
      var confirmed=confMatch?confMatch[0].replace(/\s/g,''):'';
      var warns=getWarnings(r); var warnMark=warns.length?' ⚠️':'';
      var hhmm=t1p[5]||r.rideHHMM||'', timeStr=hhmm?hhmm.slice(0,2)+':'+hhmm.slice(2):'';
      var addrShort=t1p.length>=3?t1p[2]:(r.address||'').split(' ')[0];
      var airport=r.airport||'T1', airportShort=airport.replace('인천공항','').trim()||airport;
      var dir=t1.indexOf(' 입 ')>=0||t1.startsWith('중 입')||t1.startsWith('대 입')||t1.startsWith('콜 입')||t1.startsWith('쏠 입')?'in':'out';
      var line1=isLg
        ? r.baechaNum+'. '+(confirmed?confirmed+' ':'')+warnMark+' '+vehLabel+(extras?' '+extras:'')
        : r.baechaNum+'. '+(extras?extras+' ':'')+warnMark+(confirmed?' '+confirmed:'');
      var line2=dir==='out'?timeStr+' '+addrShort+' → '+airportShort:timeStr+' '+airportShort+' → '+addrShort;
      if(isLg){ linesLg.push(line1.trim()); linesLg.push(line2.trim()); linesLg.push(''); }

function getRideDate(r){
  if(r.rideDate) return r.rideDate;
  var parts=(r.title1||'').split(' ');
  var yy=parts[3]||'', mmdd=parts[4]||'';
  if(yy.length===2&&mmdd.length===4){
    return '20'+yy+'-'+mmdd.slice(0,2)+'-'+mmdd.slice(2);
  }
  return '';
}

function getGroupOrder(r){
  var t1=(r.title1||'').trim();
  var parts=t1.split(' ');
  var veh=parts[0]||'';
  var dir=parts[1]||'';
  var isIn=(dir==='입');
  if(veh==='중') return isIn?2:1;
  if(veh==='대') return isIn?4:3;
  if(veh==='콜') return isIn?6:5;
  if(veh==='쏠') return isIn?8:7;
  return isIn?2:1;
}

function autoRenumber(rideDate){
  return db.ref('cards').once('value').then(function(snap){
    var list=[], maxNum=30, listWasGenerated=false;
    snap.forEach(function(child){
      var r=Object.assign({id:child.key}, child.val());
      if(getRideDate(r)===rideDate){
        if(r.baechaNum&&r.baechaNum>maxNum) maxNum=r.baechaNum;
        if(r.baechaNum&&(r.status==='배차완료'||r.status==='재배차완료')) listWasGenerated=true;
      }
      if(r.status==='확정'&&getRideDate(r)===rideDate) list.push(r);
    });
    var updates={};
    var isLocked=mListLocked[rideDate]||listWasGenerated;
    if(isLocked){
      var noNum=list.filter(function(r){ return !r.baechaNum; });
      noNum.sort(function(a,b){
        var ga=getGroupOrder(a), gb=getGroupOrder(b);
        if(ga!==gb) return ga-gb;
        return (a.rideHHMM||'').localeCompare(b.rideHHMM||'');
      });
      noNum.forEach(function(r,i){ updates['cards/'+r.id+'/baechaNum']=maxNum+1+i; });
    } else {
      list.sort(function(a,b){
        var ga=getGroupOrder(a), gb=getGroupOrder(b);
        if(ga!==gb) return ga-gb;
        return (a.rideHHMM||'').localeCompare(b.rideHHMM||'');
      });
      list.forEach(function(r,i){ updates['cards/'+r.id+'/baechaNum']=31+i; });
    }
    if(Object.keys(updates).length) return db.ref().update(updates);
  });
}

function addSeparators(arr){
  var result=[], lastGroup=null;
  for(var i=0;i<arr.length;i+=3){
    var line1=arr[i]||'', line2=arr[i+1]||'';
    var isIn=line2.indexOf('→ T')<0&&line2.indexOf('→T')<0;
    var grp=isIn?'입국':'출국';
    if(grp!==lastGroup){ result.push('〓〓〓'+grp+'〓〓〓'); result.push(''); lastGroup=grp; }
    result.push(line1); result.push(line2); result.push('');
  }
  return result;
}

function addLargeSeparators(arr){
  var result=[], lastGrp=null;
  for(var i=0;i<arr.length;i+=3){
    var line1=arr[i]||'', line2=arr[i+1]||'';
    var veh=line1.indexOf('대형')>=0?'대형':line1.indexOf('콜밴')>=0?'콜밴':line1.indexOf('쏠라티')>=0?'쏠라티':'대형';
    var isIn=line2.indexOf('→ T')<0&&line2.indexOf('→T')<0;
    var grp=veh+(isIn?'입국':'출국');
    if(grp!==lastGrp){ result.push('〓〓〓'+veh+(isIn?' 입국':' 출국')+'〓〓〓'); result.push(''); lastGrp=grp; }
    result.push(line1); result.push(line2); result.push('');
  }
  return result;
}

function doMAutoMatch(){
  var ta=document.getElementById('m-match-ta').value.trim();
  if(!ta){ alert('기사 응답을 붙여넣어주세요!'); return; }
  var lines=ta.split('\n');
  var map={};
  lines.forEach(function(line){
    var m=line.trim().match(/^(\d+)[.\s]\s*([가-힣a-zA-Z].+)$/);
    if(m){ var num=parseInt(m[1]); var name=m[2].trim(); if(name) map[num]=name; }
  });
  if(Object.keys(map).length===0){ alert('기사 응답이 없어요!\n예: 31. 홍길동'); return; }
  var dateV=document.getElementById('m-date').value;
  var updates={};
  var count=0;
  allData.forEach(function(r){
    // 사이드바 조건과 동일: 확정 + 해당날짜 + 기사 미배정
    if(r.status!=='확정'||getRideDate(r)!==dateV) return;
    if(r.baechaNum&&map[r.baechaNum]){
      var drvName=map[r.baechaNum];
      var drv=allDrivers.find(function(d){ return d.name===drvName; });
      updates['driverMap/'+r.id]={driver:drvName, kakao:'', phone:drv?drv.phone:'', vehicle:drv?drv.vehicle:'', vehicleNum:drv?drv.vehicleNum:''};
      count++;
    }
  });
  if(count===0){ alert('매칭된 카드가 없어요!'); return; }

  // 이미 배정된 카드 덮어쓰기 확인
  var overwriteCards=[];
  Object.keys(updates).forEach(function(key){
    var id=key.replace('driverMap/','');
    if(driverMap[id]&&driverMap[id].driver) overwriteCards.push(driverMap[id].driver+' → '+updates[key].driver);
  });
  if(overwriteCards.length>0){
    if(!confirm('⚠️ 이미 배정된 카드가 있어요!\n\n'+overwriteCards.join('\n')+'\n\n덮어쓰겠습니까?')) return;
  }
  db.ref().update(updates).then(function(){
    // driverMap 로컬 즉시 업데이트
    Object.keys(updates).forEach(function(key){
      var id=key.replace('driverMap/','');
      driverMap[id]=updates[key];
    });
    // 입력란 초기화 + 화면 갱신 먼저
    document.getElementById('m-match-ta').value='';
    renderSidebar();
    renderInfoList();
    // alert는 마지막에
    setTimeout(function(){ alert('✅ '+count+'개 카드 자동 매칭 완료!'); }, 50);
  }).catch(function(e){
    alert('오류: '+e.message);
  });
}

function doMResetMatch(){
  if(!confirm('매칭을 초기화할까요?')) return;
  var updates={};
  allData.forEach(function(r){ if(r.baechaNum&&driverMap[r.id]) updates['driverMap/'+r.id]=null; });
  db.ref().update(updates).then(function(){ alert('✅ 매칭 초기화됐어요!'); });
}

function openDriverPastePopup(){

function parseDrvPaste(){
  var text=document.getElementById('drv-paste-input').value.trim();
  if(!text){ alert('내용을 붙여넣어주세요!'); return; }
  var name='',phone='',vehicle='',vehicleNum='';
  // 이름: 이름:|성함:|기사: 형식
  var nameM=text.match(/(?:이름|성함|기사)[^:：]*[:：]\s*([가-힣]{2,5})/);
  if(nameM){ name=nameM[1].trim(); }
  else{ var nameM2=text.match(/(?:^|\n)([가-힣]{2,4})(?=[ \t]|$)/m); if(nameM2) name=nameM2[1].trim(); }
  // 전화번호
  var phoneM=text.match(/01[0-9][\s.\-]?\d{3,4}[\s.\-]?\d{4}/);
  if(phoneM) phone=phoneM[0].replace(/[\s.\-]/g,'');
  // 차량번호: 번호:|차량번호: 형식 우선, 없으면 패턴 직접 검색
  var vnumPrefixM=text.match(/(?:번호|차량번호)[^:：]*[:：]\s*([가-힣]{1,3}\s*\d{2,3}\s*[가-힣]\s*\d{4})/);
  if(vnumPrefixM){ vehicleNum=vnumPrefixM[1].replace(/\s/g,''); }
  else{ var vnumM=text.match(/[가-힣]{2,3}\s*\d{2,3}\s*[가-힣]\s*\d{4}/); if(vnumM) vehicleNum=vnumM[0].replace(/\s/g,''); }
  // 차종: 차종:|차량: 형식 우선, 없으면 키워드 검색
  var vehM=text.match(/(?:차종|차량)[^:：]*[:：]\s*([^\n\r]+)/);
  if(vehM){ vehicle=vehM[1].trim(); }
  else{
    var keys=['GN7','그랜저','그랜져','K8','아이오닉','IONIQ','sonata','소나타','카니발','스타리아','쏠라티'];
    for(var vi=0;vi<keys.length;vi++){
      if(text.toLowerCase().indexOf(keys[vi].toLowerCase())>=0){
        var vR=new RegExp('[가-힣a-zA-Z0-9\\s]*'+keys[vi]+'[가-힣a-zA-Z0-9\\s()]*','i');
        var vM2=text.match(vR);
        if(vM2){ vehicle=vM2[0].trim().split('\n')[0].replace(/[^가-힣a-zA-Z0-9\s]/g,'').trim(); break; }
      }
    }
  }
  drvParsed={name:name,phone:phone,vehicle:vehicle,vehicleNum:vehicleNum};
  var preview=document.getElementById('drv-paste-preview');
  preview.style.display='block';
  var missing=[];
  if(!name) missing.push('이름');
  if(!phone) missing.push('전화번호');
  preview.innerHTML='<b>이름:</b> '+(name||'<span style="color:red">미인식</span>')+'<br>'+
    '<b>전화:</b> '+(phone||'<span style="color:red">미인식</span>')+'<br>'+
    '<b>차종:</b> '+(vehicle||'-')+'<br>'+
    '<b>번호:</b> '+(vehicleNum||'-')+
    (missing.length?'<br><span style="color:red;font-size:11px">미인식: '+missing.join(', ')+'</span>':'');
  document.getElementById('drv-paste-confirm').style.display = missing.length ? 'none' : 'block';
  // 미인식 시 setTimeout으로 팝업 (렌더 완료 후 띄우기)
  if(missing.length){
    setTimeout(function(){
      if(confirm('⚠️ 미인식 항목: '+missing.join(', ')+'\n\n직접 입력하시겠습니까?')){
        openManualDrv();
      }
    }, 100);
  }
}

  }).then(function(){

  var phone=document.getElementById('manual-drv-phone').value.trim();
  var vehicle=document.getElementById('manual-drv-vehicle').value.trim();
  var vehicleNum=document.getElementById('manual-drv-vnum').value.trim();

  phone=phone.replace(/[\s.\-]/g,'');

  // 기사목록 저장
  db.ref('drivers').orderByChild('name').equalTo(name).once('value').then(function(snap){
    if(!snap.exists()) db.ref('drivers').push({name:name,phone:phone,vehicle:vehicle,vehicleNum:vehicleNum});

  // 바로배차 컨텍스트
  if(window._baroManualMode){

    updateBaroBtns();

  // 매칭완료+정보전달 컨텍스트
  if(!infoSelected){ closePopup('popup-drv-manual'); return; }
  db.ref('driverMap/'+infoSelected.id).update({
    driver:name, phone:phone, vehicle:vehicle, vehicleNum:vehicleNum
  }).then(function(){
    closePopup('popup-drv-manual');
    renderInfoList();
  });

function genBaroList(){
  if(!baroCard) return;
  var r=baroCard;
  // body에서 title1 파싱 (경고줄 건너뜀)
  var bodyLines=(r.body||r.tail||'').split('\n');
  var t1=bodyLines.slice(0,5).find(function(l){ return /^[중대콜쏠]/.test(l.trim()); })||r.title1||'';
  var t1lower=t1.toLowerCase();
  var t1p=t1.split(' ');
  var veh=t1p[0]||'';
  var vehLabel=veh==='대'?'대형':veh==='콜'?'콜밴':veh==='쏠'?'쏠라티':'';
  var dtype=t1lower.indexOf('g우선')>=0?'G우선':t1lower.indexOf('eq배차')>=0?'EQ배차':t1lower.indexOf('gqe')>=0?'GQE':'';
  var hasWaypoint=t1lower.indexOf('경유')>=0;
  var body=r.body||'', confMatch=body.match(/확정\s*[\d,]+원|확정\s*\d+만/);
  var confirmed=confMatch?confMatch[0].replace(/\s/g,''):'';
  // 시간은 title1에서 파싱 (t1p[5])
  var hhmm=t1p[5]||r.rideHHMM||'', timeStr=hhmm?hhmm.slice(0,2)+':'+hhmm.slice(2):'';
  var addrShort=t1p.length>=3?t1p[2]:(r.address||'').split(' ')[0];
  var airport=r.airport||'T1', airportShort=airport.replace('인천공항','').trim()||airport;
  var dir=t1.indexOf(' 입 ')>=0||t1.startsWith('중 입')||t1.startsWith('대 입')||t1.startsWith('콜 입')||t1.startsWith('쏠 입')?'in':'out';
  var line2=dir==='out'?timeStr+' '+addrShort+' → '+airportShort:timeStr+' '+airportShort+' → '+addrShort;
  // 카드 날짜로 헤더 생성
  var rideDate=getRideDate(r);
  var today=new Date(); today.setHours(0,0,0,0);
  var tomorrow=new Date(); tomorrow.setDate(today.getDate()+1); tomorrow.setHours(0,0,0,0);
  var cardDate=rideDate?new Date(rideDate.replace(/-/g,'/')):today;
  cardDate.setHours(0,0,0,0);
  var dayLabel=cardDate.getTime()===today.getTime()?'오늘':cardDate.getTime()===tomorrow.getTime()?'내일':'';
  var dateLabel=(cardDate.getMonth()+1)+'월 '+cardDate.getDate()+'일';
  var isLarge=(veh==='대'||veh==='콜'||veh==='쏠');
  var header, line1;
  if(currentBaroTab===0){
    var num=r.baechaNum||'';
    header='✈️인천공항센터(SKY LINE)✈️\n'+(dayLabel?dayLabel+' ':'')+'✈️ '+dateLabel;
    line1=isLarge
      ? (num?num+'. ':'')+( confirmed?confirmed+' ':'')+vehLabel+(hasWaypoint?' 경유':'')
      : (num?num+'. ':'')+( dtype?dtype+' ':'')+(confirmed?confirmed+' ':'')+(hasWaypoint?' 경유':'');
  } else {
    header='급좌표';
    line1=isLarge
      ? (dtype?dtype+' ':'')+(confirmed?confirmed+' ':'')+vehLabel+(hasWaypoint?' 경유':'')
      : (dtype?dtype+' ':'')+(confirmed?confirmed+' ':'')+(hasWaypoint?' 경유':'');
  }
  var preview=header+'\n\n'+line1.trim()+'\n'+line2.trim();
  document.getElementById('baro-list-preview').textContent=preview;
}

function doBaroMatchPaste(){
  var text=document.getElementById('baro-drv-paste').value.trim();
  if(!text){ alert('기사 정보를 붙여넣어주세요!'); return; }

  var name='', phone='', vehicle='', vehicleNum='';
  // 이름: 기사:|이름:|성함: 형식
  var nameM=text.match(/(?:이름|성함|기사)[^:：]*[:：]\s*([가-힣]{2,5})/);
  if(nameM){ name=nameM[1].trim(); }
  else{ var nameM2=text.match(/(?:^|\n)([가-힣]{2,4})(?=[ \t]|$)/m); if(nameM2) name=nameM2[1].trim(); }

  var phoneM=text.match(/01[0-9][\s.\-]?\d{3,4}[\s.\-]?\d{4}/);
  if(phoneM) phone=phoneM[0].replace(/[\s.\-]/g,'');

  // 차량번호: 번호:|차량번호: 형식 우선
  var vnumPrefixM=text.match(/(?:번호|차량번호)[^:：]*[:：]\s*([가-힣]{1,3}\s*\d{2,3}\s*[가-힣]\s*\d{4})/);
  if(vnumPrefixM){ vehicleNum=vnumPrefixM[1].replace(/\s/g,''); }
  else{ var vnumM=text.match(/[가-힣]{2,3}\s*\d{2,3}\s*[가-힣]\s*\d{4}/); if(vnumM) vehicleNum=vnumM[0].replace(/\s/g,''); }

  var vehM=text.match(/(?:차종|차량)[^:：]*[:：]\s*([^\n\r]+)/);
  if(vehM){ vehicle=vehM[1].trim(); }
  else{
    var vehKeywords=['GN7','그랜저','그랜져','K8','아이오닉','IONIQ','sonata','소나타','카니발','스타리아','쏠라티'];
    for(var vi=0;vi<vehKeywords.length;vi++){
      if(text.toLowerCase().indexOf(vehKeywords[vi].toLowerCase())>=0){
        var vReg=new RegExp('[가-힣a-zA-Z0-9\\s]*'+vehKeywords[vi]+'[가-힣a-zA-Z0-9\\s()]*','i');
        var vM2=text.match(vReg);
        if(vM2){ vehicle=vM2[0].trim().split('\n')[0].replace(/[^가-힣a-zA-Z0-9\s]/g,'').trim(); break; }
      }
    }
  }

  var missing=[];
  if(!name) missing.push('이름');
  if(!phone) missing.push('전화번호');

  if(missing.length>0){
    // 미인식 시 수동입력 팝업
    drvParsed={name:name,phone:phone,vehicle:vehicle,vehicleNum:vehicleNum};
    setTimeout(function(){
      if(confirm('⚠️ 미인식 항목: '+missing.join(', ')+'\n\n직접 입력하시겠습니까?')){
        // 바로배차용 수동입력 (infoSelected 없이 처리)
        document.getElementById('manual-drv-name').value=name;
        document.getElementById('manual-drv-phone').value=phone;
        document.getElementById('manual-drv-vehicle').value=vehicle;
        document.getElementById('manual-drv-vnum').value=vehicleNum;
        document.getElementById('popup-drv-manual').classList.add('show');
        // 저장 시 바로배차 카드로 연결되게 컨텍스트 설정
        window._baroManualMode=true;
      }
    },100);
    return;
  }

  var drvInfo='기사:'+name+'\n전화:'+phone+'\n차종:'+vehicle+'\n번호:'+vehicleNum;
  document.getElementById('baro-driver-content').textContent=drvInfo;
  baroDriverDone=true;
  updateBaroBtns();

  // PC 기사목록에 자동저장 (이름+전화 있을 때만, 동명이인 없을 때만)
  if(name&&phone){
    db.ref('drivers').orderByChild('name').equalTo(name).once('value').then(function(snap){
      if(!snap.exists()){
        db.ref('drivers').push({name:name,phone:phone,vehicle:vehicle,vehicleNum:vehicleNum});
      }
    });
  }
}

  document.getElementById('baro-btn-drvcp').classList.toggle('dis',!matched);

function doBaroDone(){
  if(!baroCard) return;
  var drvText=document.getElementById('baro-driver-content').textContent;
  var lines=drvText.split('\n');
  var drvName='', drvPhone='', drvVeh='', drvVNum='';
  lines.forEach(function(l){
    if(l.startsWith('기사:')) drvName=l.replace('기사:','').trim();
    else if(l.startsWith('전화:')) drvPhone=l.replace('전화:','').trim();
    else if(l.startsWith('차종:')) drvVeh=l.replace('차종:','').trim();
    else if(l.startsWith('번호:')) drvVNum=l.replace('번호:','').trim();
  });
  var updates={status:'배차완료',driverName:drvName,driverPhone:drvPhone,driverVehicleType:drvVeh,driverVehicleNum:drvVNum,kakaoNick:baroCard.kakaoNick||''};
  if(baroIsReb){
    var prevDriver=baroCard.driverName||'';
    if(prevDriver&&drvName) updates.driverHistory=(baroCard.driverHistory?baroCard.driverHistory+' >> ':prevDriver+' >> ')+drvName;
    updates.status='재배차완료';
  }
  var _rideDateBaro=getRideDate(baroCard);
  db.ref('cards/'+baroCard.id).update(updates).then(function(){
    alert('✅ 배차완료!'); closeBaroScreen();
    if(baroIsReb&&_rideDateBaro) autoRenumber(_rideDateBaro);
  });
}

function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4-base64String.length%4)%4);
  var base64 = (base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  var rawData = window.atob(base64);
  var output = new Uint8Array(rawData.length);
  for(var i=0;i<rawData.length;i++) output[i]=rawData.charCodeAt(i);
  return output;
}

async function initPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return;
  try{
    swReg = await navigator.serviceWorker.register('/sw.js');
    var perm = await Notification.requestPermission();
    if(perm!=='granted') return;
    var sub = await swReg.pushManager.getSubscription();
    if(!sub){
      sub = await swReg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    await fetch('/api/push', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'subscribe', subscription: sub.toJSON()})
    });
    console.log('푸시 구독 완료!');
  }catch(e){ console.log('푸시 초기화 실패:', e); }
}

  if('serviceWorker' in navigator){

}

var knownCardIds = null;
function checkNewCard(data){
  var waitCards = Object.keys(data||{}).filter(function(k){ return data[k].status==='대기'; });
  if(knownCardIds === null){ knownCardIds = new Set(waitCards); return; }
  var newCards = waitCards.filter(function(k){ return !knownCardIds.has(k); });
  newCards.forEach(function(k){
    knownCardIds.add(k);
    var r = data[k];
    fetch('/api/push',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'send',
        title:'🚕 새 예약 들어왔어요!',
        body: (r.name||'손님')+' · '+(r.title1||''),
        badge: waitCards.length
      })
    });
  });
}
