<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>애니콜택시 - 예상요금 확인하기</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f5f7fa;min-height:100vh;display:flex;justify-content:center;}
.wrap{width:100%;max-width:440px;padding-bottom:40px}
.hdr{background:linear-gradient(135deg,#f5b800,#ffdd57);padding:12px 16px;display:flex;align-items:center;gap:10px}
.hdr-icon{font-size:24px}
.hdr-sub{font-size:8px;font-weight:700;color:rgba(0,0,0,0.45);letter-spacing:.15em}
.hdr-title{font-size:17px;font-weight:900;color:#1a1a1a}
.body{padding:13px 13px 0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;align-items:center;margin-bottom:12px;}
.tab{flex:2;padding:10px 5px;border:1.5px solid #e0e0e0;border-radius:9px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:700;transition:all .18s;color:#888;background:#ffffff;line-height:1.4;text-align:center}.tab.long{flex:1.2;font-size:8px}
.tab:hover{border-color:#f5b800;color:#c8880a}.tab-arrow{font-size:15px;color:#c8880a;flex-shrink:0;font-weight:700}
.tab.on{background:linear-gradient(135deg,#f5b800,#ffdd57);color:#1a1a1a;border-color:#f5b800;border-width:2px}
.field{margin-bottom:9px;position:relative}
.lbl{display:block;font-size:10px;font-weight:700;color:#555;letter-spacing:.08em;margin-bottom:4px}
.inp,.sel{width:100%;padding:10px 12px;background:#ffffff;border:1.5px solid #e0e0e0;border-radius:9px;color:#333333;font-size:13px;font-family:inherit;outline:none;appearance:none;-webkit-appearance:none;transition:border-color .2s}
.inp:focus,.sel:focus{border-color:#f5b800}
.inp::placeholder{color:#aaa}
.sel option{background:#ffffff;color:#333333}
.row2{display:flex;gap:8px}
.row2 .field{flex:1}
.row2 .field.w2{flex:2}

/* 자동완성 */
.ac{position:absolute;top:100%;left:0;right:0;z-index:200;background:#ffffff;border:1.5px solid #e0e0e0;border-radius:8px;margin-top:2px;max-height:200px;overflow-y:auto;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.12)}
.ac.show{display:block}
.ac-item{padding:10px 12px;font-size:12px;color:#333333;cursor:pointer;border-bottom:1px solid #f0f0f0;line-height:1.4}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:rgba(245,184,0,0.12)}
.ac-main{font-weight:600}
.ac-sub{font-size:11px;color:#999;margin-top:2px}
.ac-msg{padding:12px;font-size:12px;color:#aaa;text-align:center}

.calc-btn{width:100%;margin-top:12px;padding:14px;background:linear-gradient(135deg,#f5b800,#ffdd57);border:none;border-radius:10px;font-size:14px;font-weight:700;color:#1a1a1a;cursor:pointer;font-family:inherit;transition:all .15s}
.calc-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}

/* 결과 */
.result-box{margin-top:12px;border-radius:12px;border:1.5px solid #e0e0e0;background:#ffffff;overflow:hidden;animation:sli .25s ease}
@keyframes sli{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ri{padding:14px}
.el{font-size:9px;font-weight:700;color:#c8880a;letter-spacing:.13em;margin-bottom:4px}
.ep{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.price{font-size:30px;font-weight:900;color:#1a1a1a;letter-spacing:-.02em}
.nb{background:#ff6b35;border-radius:4px;padding:2px 7px;font-size:9px;color:#ffffff;font-weight:700}
.em{color:#777;font-size:11px;margin-bottom:10px}
.bd{border-top:1px solid #eeeeee;padding-top:9px;display:flex;flex-direction:column;gap:5px}
.br{display:flex;justify-content:space-between;font-size:12px}
.br .k{color:#888}
.br .v{color:#333}
.br.tot{margin-top:4px;padding-top:6px;border-top:1px dashed #f5b800}
.br.tot .k{color:#555;font-weight:700}
.br.tot .v{color:#c8880a;font-weight:700}
.nt{margin-top:9px;font-size:10px;color:#aaa;line-height:1.7}
.btn-row{display:flex;gap:8px;margin-top:11px}
.kbtn{flex:1;padding:11px 8px;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.kbtn.main{background:linear-gradient(135deg,#f5b800,#ffdd57);color:#1a1a1a}
.kbtn.sub{background:#ffffff;border:1.5px solid #f5b800;color:#c8880a}
.kbtn:hover{filter:brightness(1.05)}

/* 지도 */
.map-wrap{margin-top:11px;border-radius:12px;overflow:hidden;border:1.5px solid #e0e0e0;animation:sli .3s ease}
.map-hdr{background:#fffbea;padding:8px 13px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #f0e68c}
.map-hdr-txt{font-size:11px;font-weight:700;color:#555}
.map-hdr-dist{margin-left:auto;font-size:11px;font-weight:700;color:#c8880a}
#map{height:240px;width:100%}
.map-load{height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#aaa;font-size:12px}
.spinner{width:24px;height:24px;border:2px solid #ffe082;border-top-color:#f5b800;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 커스텀 드롭다운 */
.csel{width:100%;padding:9px 11px;background:#ffffff;border:1.5px solid #e0e0e0;border-radius:8px;color:#aaa;font-size:13px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.csel.selected{color:#333333}
.csel-arrow{font-size:10px;opacity:.5}
.csel-opts{display:none;position:absolute;z-index:100;width:100%;background:#ffffff;border:1.5px solid #e0e0e0;border-radius:8px;overflow:hidden;margin-top:3px;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.csel-opts.open{display:block}
.csel-opt{padding:11px 13px;font-size:13px;color:#333333;cursor:pointer;transition:background .1s}
.csel-opt:hover{background:#fffbea;color:#333333}
.csel-opt.on{background:#fff8e1;color:#c8880a;font-weight:700}
.csel-opt-desc{font-size:10px;color:#999;margin-top:2px}
.csel-wrap{position:relative}
.err-msg{margin-top:8px;padding:10px 12px;background:rgba(255,80,80,0.08);border:1px solid rgba(255,80,80,0.25);border-radius:8px;font-size:12px;color:#e05555;display:none}
.stepper{display:flex;align-items:center;background:#ffffff;border:1.5px solid #e0e0e0;border-radius:9px;overflow:hidden;height:40px}
.stepper-btn{width:36px;height:100%;border:none;background:#fff8e1;color:#c8880a;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.stepper-btn:hover{background:#ffe082}
.stepper-btn:active{background:#ffd54f}
.stepper-val{flex:1;text-align:center;color:#333333;font-size:14px;font-weight:700;font-family:inherit}
.err-msg.show{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .4s ease}

.tmp-popup-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:9000;display:flex;align-items:center;justify-content:center}
.tmp-popup{background:#fff;border-radius:16px;padding:24px 20px;max-width:320px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
.tmp-popup-icon{font-size:32px;margin-bottom:8px}
.tmp-popup-title{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
.tmp-popup-sub{font-size:13px;color:#888;margin-bottom:20px;line-height:1.5}
.tmp-popup-btns{display:flex;gap:10px}
.tmp-popup-btn-yes{flex:1;padding:12px;background:linear-gradient(135deg,#f5b800,#ffdd57);border:none;border-radius:10px;font-size:14px;font-weight:700;color:#1a1a1a;cursor:pointer}
.tmp-popup-btn-no{flex:1;padding:12px;background:#f5f5f5;border:none;border-radius:10px;font-size:14px;font-weight:700;color:#888;cursor:pointer}

.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#ffffff;border-radius:16px 16px 0 0;width:100%;max-width:440px;padding:16px 16px 32px;max-height:82vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:14px;width:28px;height:28px;border:none;background:#fff8e1;border-radius:50%;color:#c8880a;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.extra-section{margin-bottom:14px}
.extra-label{font-size:10px;font-weight:700;color:#555;letter-spacing:.08em;margin-bottom:4px;display:block}
.extra-label.req{color:#c8880a}
.extra-label.req::after{content:' *';color:#c8880a}
.extra-inp{width:100%;padding:11px 12px;background:#ffffff;border:1.5px solid #e0e0e0;border-radius:9px;color:#333333;font-size:13px;font-family:inherit;outline:none}
.extra-inp.req{border-color:#f5b800}
.extra-inp:focus{border-color:#f5b800}
.extra-inp::placeholder{color:#aaa}
.extra-divider{border:none;border-top:1px solid #eeeeee;margin:14px 0}
.extra-opt-title{font-size:10px;font-weight:700;color:#999;letter-spacing:.1em;margin-bottom:10px}
.extra-row{display:flex;gap:8px}
.extra-row .extra-section{flex:1}
.modal-title{font-size:13px;font-weight:700;color:#c8880a;margin-bottom:12px;padding-right:32px}
.modal-card{background:#fafafa;border:1.5px solid #e0e0e0;border-radius:10px;padding:14px;font-size:12px;color:#333333;line-height:1.8;white-space:pre-wrap;word-break:break-all}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.modal-btn{flex:1;padding:13px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.modal-btn.copy{background:linear-gradient(135deg,#f5b800,#ffdd57);color:#1a1a1a}
.modal-btn.copy.done{background:#22c55e;border-color:#22c55e;color:#ffffff}
.modal-btn.kakao{background:linear-gradient(135deg,#f5b800,#ffdd57);color:#1a1a1a;padding:22px;font-size:17px}
.confirm-check-wrap{margin-top:14px;background:#fffbea;border:2px solid #f5b800;border-radius:14px;padding:20px 16px;text-align:center}
.paste-img-wrap{position:relative;width:100%;max-width:320px;margin:0 auto 16px;overflow:hidden;border-radius:10px}
.paste-img-wrap img{width:100%;display:block}
.paste-fade-top{position:absolute;top:0;left:0;right:0;height:10px;background:linear-gradient(to bottom,rgba(255,251,234,0.9),transparent)}
.paste-fade-bot{position:absolute;bottom:0;left:0;right:0;height:10px;background:linear-gradient(to top,rgba(255,251,234,0.9),transparent)}
.paste-fade-l{position:absolute;top:0;left:0;bottom:0;width:8px;background:linear-gradient(to right,rgba(255,251,234,0.9),transparent)}
.paste-fade-r{position:absolute;top:0;right:0;bottom:0;width:8px;background:linear-gradient(to left,rgba(255,251,234,0.9),transparent)}
.confirm-msg{font-size:12px;color:#333333;line-height:1.8;margin-bottom:12px}
.confirm-msg .warn{color:#f5b800;font-weight:700}
.confirm-msg .danger{color:#ff6b6b;font-weight:700}
.confirm-check-label{display:flex;align-items:center;gap:8px;font-size:12px;color:#333333;cursor:pointer;font-weight:700}
.confirm-check-label input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#f5b800}
.modal-guide{display:none;background:#ffffff;border:1.5px solid #f5b800;border-radius:14px;padding:20px 16px;text-align:center;line-height:1.8}
.modal-guide.show{display:block}
.modal-guide-icon{font-size:28px;margin-bottom:6px}
.modal-guide-title{font-size:11px;font-weight:500;color:#888;margin-top:12px}
.modal-guide-sub{font-size:20px;font-weight:900;color:#c8880a;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-icon">✈️</div>
    <div>
      <div class="hdr-sub">ANICALL TAXI · 애니콜택시</div>
      <div class="hdr-title">예상요금 확인하기</div>
    </div>
  </div>

  <div class="body">
    <div class="tabs" style="order:0">
      <button class="tab on" id="tab-out" onclick="switchTab('출국')">🛫 출국</button>
      <span class="tab-arrow">⇄</span>
      <button class="tab" id="tab-in" onclick="switchTab('입국')">🛬 입국</button>
      <span class="tab-arrow" style="display:none">⇄</span>
      <button class="tab long" id="tab-long" onclick="switchTab('장거리')" style="display:none">🚗<br><span style="white-space:nowrap">전국장거리</span></button>
    </div>

    <div class="field" id="field-addr" style="order:2">
      <label class="lbl" id="lbl-addr">출발지 주소</label>
      <input class="inp" id="inp-addr" placeholder="예: 테헤란로 64길 8" autocomplete="off"
        oninput="onAddrInput()" onblur="hideAc()">
      <div class="ac" id="ac-list"></div>
    </div>
    <div class="field" id="field-detail" style="order:3;margin-top:-4px">
      <input class="inp" id="inp-detail" placeholder="상세주소 (동/호수/건물명 등)" autocomplete="off" oninput="tmpScheduleSave()">
    </div>
    <div id="waypoint-section" style="order:4;margin-top:2px;margin-bottom:0">
      <div id="waypoint-list"></div>
      <div style="display:flex;justify-content:flex-end">
        <button id="btn-add-waypoint" onclick="addWaypoint()" style="padding:7px 14px;background:linear-gradient(135deg,#f5b800,#ffdd57);border:none;border-radius:8px;font-size:12px;font-weight:700;color:#1a1a1a;cursor:pointer;margin-bottom:6px">+ 경유지 추가</button>
      </div>
    </div>

    <div class="field" id="field-airport" style="order:5">
      <label class="lbl" id="lbl-ap">도착 공항</label>
      <div class="csel-wrap">
        <div class="csel" id="csel-ap" onclick="toggleCsel('ap')">
          <span id="csel-ap-txt">선택해주세요</span>
          <span class="csel-arrow">▼</span>
        </div>
        <div class="csel-opts" id="csel-ap-opts">
          <div class="csel-opt" onclick="selectAirport('T1')">인천공항 T1</div>
          <div class="csel-opt" onclick="selectAirport('T2')">인천공항 T2</div>
        </div>
      </div>
      <input type="hidden" id="sel-airport" value="">
    </div>

    <div class="field" id="field-long" style="display:none;order:99">
      <label class="lbl">도착지 주소</label>
      <input class="inp" id="inp-long" placeholder="예: 해운대역, 아산병원, 강원랜드 등" autocomplete="off"
        oninput="onLongInput()" onblur="hideAcLong()">
      <div class="ac" id="ac-list-long"></div>
    </div>

    <div class="row2" style="order:7">
      <div class="field w2">
        <label class="lbl">탑승 일시</label>
        <input class="inp" type="datetime-local" id="inp-date" style="font-size:12px" onchange="clearResult();tmpScheduleSave()">
      </div>
      <div class="field">
        <label class="lbl">인원</label>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepPax(-1)">−</button>
          <span class="stepper-val" id="inp-pax">0</span>
          <button class="stepper-btn" onclick="stepPax(1)">+</button>
        </div>
      </div>
    </div>

    <!-- 항공편명 (입국만) -->
    <div class="field" id="field-flight" style="display:none;order:6">
      <label class="lbl">✈️ 항공편명 <span style="color:#f5b800">(필수)</span></label>
      <input class="inp" id="inp-flight" placeholder="예: KE123, OZ456" autocomplete="off" oninput="onFlightInput(this)">
    </div>

    <!-- 짐 정보 -->
    <div class="row3" style="display:flex;gap:7px;margin-bottom:9px;margin-top:0;order:8">
      <div class="field" style="flex:1;margin-bottom:0">
        <label class="lbl" style="font-size:9px;letter-spacing:0">화물용 캐리어(대)</label>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepVal('inp-cargo',-1)">−</button>
          <span class="stepper-val" id="inp-cargo">0</span>
          <button class="stepper-btn" onclick="stepVal('inp-cargo',1)">+</button>
        </div>
      </div>
      <div class="field" style="flex:1;margin-bottom:0">
        <label class="lbl" style="font-size:9px;letter-spacing:0">기내용 캐리어(소)</label>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepVal('inp-cabin',-1)">−</button>
          <span class="stepper-val" id="inp-cabin">0</span>
          <button class="stepper-btn" onclick="stepVal('inp-cabin',1)">+</button>
        </div>
      </div>
      <div class="field" style="flex:1;margin-bottom:0">
        <label class="lbl" style="font-size:9px;letter-spacing:0">골프백/기타</label>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepVal('inp-golf',-1)">−</button>
          <span class="stepper-val" id="inp-golf">0</span>
          <button class="stepper-btn" onclick="stepVal('inp-golf',1)">+</button>
        </div>
      </div>
    </div>

    <div class="field" style="order:9">
      <label class="lbl">차량 종류</label>
      <div class="csel-wrap">
        <div class="csel" id="csel-veh" onclick="toggleCsel('veh')">
          <span id="csel-veh-txt">선택해주세요</span>
          <span class="csel-arrow">▼</span>
        </div>
        <div class="csel-opts" id="csel-veh-opts">
          <div class="csel-opt" onclick="selectVeh('medium')">
            🚕 일반택시 (4인승)
            <div class="csel-opt-desc">GN7·K8(세단형) / 스포티지·아이오닉5·EV6 등(SUV형)</div>
          </div>
          <div class="csel-opt" onclick="selectVeh('large')">
            🚙 대형택시 (5~8인승)
            <div class="csel-opt-desc">스타리아 · 골프장 · 가족여행 · 장거리 편안한 이동시</div>
          </div>
          <div class="csel-opt" onclick="selectVeh('van')">
            🚐 콜밴택시 (4인승)
            <div class="csel-opt-desc">짐이 많을때 · 큰 짐이 있을때</div>
          </div>
          <div class="csel-opt" onclick="selectVeh('solar')">
            🚌 미니버스 (15인승)
            <div class="csel-opt-desc">쏠라티 · 단체 · 행사 · 가족여행</div>
          </div>
        </div>
      </div>
      <input type="hidden" id="sel-veh" value="">
    </div>

    <div class="err-msg" id="err-msg" style="order:24"></div>
    <button class="calc-btn" onclick="calculate()" id="btn-calc" style="order:25">🔍 예상요금 확인하기</button>

    <div id="result-wrap" style="order:10"></div>
    <div id="map-container" style="order:11"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// ── 채널 설정 (URL 파라미터 ?ch=k / ?ch=mega 로 전환) ──────────
const CHANNEL_CONFIG = {
  'anicall': { name:'애니콜택시', eng:'ANICALL TAXI', code:'애니', kakao:'https://pf.kakao.com/_gVxaAX/chat' },
  'k':       { name:'k-택시',     eng:'K-TAXI',       code:'k',    kakao:'http://pf.kakao.com/_aAtRX/chat' },
  'mega':    { name:'메가택시',   eng:'MEGA TAXI',    code:'메가', kakao:'http://pf.kakao.com/_ftNjX/chat' }
};
function getChannelKey(){
  var p = new URLSearchParams(location.search);
  var ch = (p.get('ch')||'').toLowerCase();
  return CHANNEL_CONFIG[ch] ? ch : 'anicall';
}
var CH_KEY = getChannelKey();
var CH = CHANNEL_CONFIG[CH_KEY];


const LARGE_FARE_BY_CITY = {

// 대형/콜밴/쏠라티 요금 조회 (할증 없음 - 무조건 확정)
async function getLargeFareAsync(addrDisplay, veh) {
  try { return getLargeFare(addrDisplay, veh); } catch(e) { return null; }
}

function getLargeFare(addrDisplay, veh){
  // 1단계: 시/군 먼저 찾기
  const cityKeys = Object.keys(LARGE_FARE_BY_CITY).sort((a,b) => b.length - a.length);
  const city = cityKeys.find(c => addrDisplay.includes(c));
  if(!city) return null;

  const cityFares = LARGE_FARE_BY_CITY[city];

  // 2단계: 동/읍/면 찾기 (긴 키 먼저)
  const dongKeys = Object.keys(cityFares).filter(k => k !== '_default')
                   .sort((a,b) => b.length - a.length);
  const dong = dongKeys.find(k => addrDisplay.includes(k));

  // 동 요금 or 기본 요금
  const fares = dong ? cityFares[dong] : cityFares['_default'];
  if(!fares) return null;

  let amount;
  if(veh==='large') amount = fares[0];
  else if(veh==='van') amount = fares[1];
  else if(veh==='solar') amount = fares[2];
  else return null;

  return { region: dong || city, amount, isSurcharge: false };
}

// 확정요금 지역 여부 + 해당 요금 반환
function getFixedFare(addrDisplay, hhmm){
  const region = Object.keys(FIXED_FARE).find(r => addrDisplay.includes(r));
  if(!region) return null;
  const fare = FIXED_FARE[region];
  // 22:00~04:00 → 할증

  return { region, amount: isSurcharge ? fare.surcharge : fare.normal, isSurcharge };
}

// ── 공동사업구역 (카카오 API로 정확하게 판단) ───────────
const SHARED_NAMES = ['서울특별시','인천광역시','고양시','부천시','김포시','광명시'];

async function isInSharedZoneAPI(lat, lng){
  try {
    const res = await fetch(`/api/route?type=region&x=${lng}&y=${lat}`);
    const data = await res.json();
    if(!data.documents || !data.documents.length) return false;
    const doc = data.documents[0];
    return SHARED_NAMES.some(name =>
      doc.region_1depth_name.includes(name) ||
      doc.region_2depth_name.includes(name)
    );
  } catch(e){ return false; }
}

// ── 두 좌표간 거리 (km, Haversine) ──────────────────────
function haversine(lat1, lng1, lat2, lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── 이진탐색으로 공동사업구역 이탈 지점 찾기 ─────────────
// API 호출 최소화: log2(n) ≈ 8회
async function findExitPointAPI(coords){
  // 목적지가 공동사업구역 안이면 할증 없음
  const last = coords[coords.length-1];
  const destIn = await isInSharedZoneAPI(last[0], last[1]);
  if(destIn) return { exitIdx: -1, normalKm: 0 };

  // 이진탐색으로 경계 찾기
  let lo = 0, hi = coords.length - 1;
  while(hi - lo > 3){
    const mid = Math.floor((lo + hi) / 2);
    const inZone = await isInSharedZoneAPI(coords[mid][0], coords[mid][1]);
    if(inZone) lo = mid;
    else hi = mid;
  }

  // lo~hi 구간 세밀하게 확인
  let exitIdx = hi;
  for(let i = lo; i <= hi; i++){
    const inZone = await isInSharedZoneAPI(coords[i][0], coords[i][1]);
    if(!inZone){ exitIdx = i; break; }
  }

  // 이탈 지점까지 거리 계산
  let normalKm = 0;
  for(let i = 0; i < exitIdx - 1; i++){
    normalKm += haversine(coords[i][0],coords[i][1],coords[i+1][0],coords[i+1][1]);
  }
  return { exitIdx, normalKm };
}

function tmpLoad(){
  try {
    const raw = localStorage.getItem(TMP_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    // 2시간 초과 → 삭제
    if(Date.now() - data.savedAt > TMP_TTL){ tmpClear(); return; }
    // 입력값이 하나도 없으면 팝업 안 띄움
    if(!data.selectedAddr && !data.selectedLong && !data.airport && !data.pax || data.pax==='0') {
      if(!data.selectedAddr && !data.selectedLong && !data.airport){ tmpClear(); return; }
    }
    // 경과 시간 계산
    const minAgo = Math.round((Date.now() - data.savedAt) / 60000);
    const timeStr = minAgo < 1 ? '방금 전' : minAgo + '분 전';
    // 팝업 표시
    showTmpPopup(timeStr, data);
  } catch(e){ tmpClear(); }
}

    if (!_fbDb) return;
    var tail = (extra.tail||'').trim();

      else if (!title1 && tl.indexOf('⚠️') !== 0 && tl.indexOf('❗') !== 0 && tl.length > 8) { title1 = tl; }
    }
    if (!title1) title1 = tailLines[0]||'';
    if (!title2) { for (var ti2=0;ti2<tailLines.length;ti2++){if(tailLines[ti2]!==title1){title2=tailLines[ti2];break;}} }
    
    // rideDate, rideHHMM
    var rideDate='', rideHHMM='';
    if (dateV) {
      var dt=new Date(dateV);
      if (!isNaN(dt)) {
        rideDate=dt.getFullYear()+'-'+(dt.getMonth()+1<10?'0':'')+(dt.getMonth()+1)+'-'+(dt.getDate()<10?'0':'')+dt.getDate();

// ── 시간대별 기본요금 (분 단위 정확하게) ────────────────
function getHHMM(dateV){
  const d = dateV ? new Date(dateV) : new Date();
  return d.getHours() * 100 + d.getMinutes();
}

function getBaseFare(hhmm){
  if(hhmm >= 2300 || hhmm < 200) return 6800;  // 23:00~01:59 40%
  if(hhmm >= 2200 || hhmm < 400) return 5700;  // 22:00~22:59, 02:00~03:59 20%
  return 4800;                                   // 평시
}

function getNightMult(hhmm){
  if(hhmm >= 2300 || hhmm < 200) return 1.4;
  if(hhmm >= 2200 || hhmm < 400) return 1.2;
  return 1.0;
}

// ── 시간대별 할증 배수 (분 단위) ─────────────────────────
function getMultiplierAt(minutesFromMidnight){
  const m = ((minutesFromMidnight % 1440) + 1440) % 1440;
  if(m >= 1380 || m < 120) return 1.4;  // 23:00~02:00
  if((m >= 1320 && m < 1380) || (m >= 120 && m < 240)) return 1.2;  // 22:00~23:00, 02:00~04:00
  return 1.0;
}

// ── 야간 예상 소요시간 (분) ───────────────────────────────
function getEstimatedMinutes(distKm){
  if(distKm < 50)  return 40;
  if(distKm < 70)  return 50;
  if(distKm < 90)  return 60;
  if(distKm < 110) return 70;
  return 80;
}

// ── 구간별 거리요금 계산 (시간대 경계 쪼개기) ─────────────
// startMin: 구간 시작(자정 기준 분), endMin: 구간 끝
// segKm: 구간 거리, perKm: km당 요금, cityMult: 시계외 배수
function calcSegmentFare(startMin, endMin, segKm, perKm, cityMult){
  if(segKm <= 0 || endMin <= startMin) return 0;
  const segTotalMin = endMin - startMin;
  // 경계점 (자정 기준 분): 22:00=1320, 23:00=1380, 02:00=120(+1440=1560), 04:00=240(+1440=1680)
  const boundaries = [120, 240, 1320, 1380, 1560, 1680, 2760, 2820].filter(b => b > startMin && b < endMin);
  const pts = [startMin, ...boundaries, endMin];
  let fare = 0;
  for(let i = 0; i < pts.length - 1; i++){
    const ratio = (pts[i+1] - pts[i]) / segTotalMin;
    const km    = segKm * ratio;
    const mult  = getMultiplierAt(pts[i] + 0.5);
    fare += km * perKm * mult * cityMult;
  }
  return Math.round(fare / 100) * 100;
}

async function calculate(){

  const errEl = document.getElementById('err-msg');
  errEl.classList.remove('show');
  clearResult();

  // ── 예약 모드 사전 검증 ──────────────────────────────────
  if(IS_BOOKING){
    const phone = (document.getElementById('bk-phone')||{}).value||'';
    const name = (document.getElementById('bk-name')||{}).value||'';
    const phoneDigits = phone.replace(/\D/g,'');
    if(phoneDigits.length !== 11){
      const el = document.getElementById('bk-phone');
      if(el){ el.style.borderColor='rgba(255,80,80,0.6)'; el.focus(); setTimeout(()=>el.style.borderColor='',1500); }
      alert('📱 전화번호를 확인해주세요! 숫자 11자리를 입력해주세요.');
      return;
    }
    if(!name){
      const el = document.getElementById('bk-name');
      if(el){ el.style.borderColor='rgba(255,80,80,0.6)'; el.focus(); setTimeout(()=>el.style.borderColor='',1500); }
      alert('이름을 입력해주세요.');
      return;
    }
  }

  // ── 기초 검증 ──────────────────────────────────────────
  const pop = (msg) => { alert(msg); return false; };

  // 1. 주소
  if(!selectedAddr && currentTab !== '장거리'){
    const q = document.getElementById('inp-addr').value.trim();
    if(!q) return pop('출발지 주소를 입력해주세요');
  }
  if(currentTab === '장거리' && !selectedLong){
    if(!document.getElementById('inp-long').value.trim()) return pop('도착지 주소를 입력해주세요');
  }

  // 2. 상세주소
  if(!document.getElementById('inp-detail').value.trim()){
    return pop('상세주소를 입력해주세요 (동/호수/건물명 등)');
  }

  // 3. 공항
  if(currentTab !== '장거리' && !document.getElementById('sel-airport').value){
    return pop(currentTab==='입국' ? '출발 공항을 선택해주세요' : '도착 공항을 선택해주세요');
  }

  // 김포공항 선택 시 요금계산 스킵 → 바로 예약카드 생성
  if(currentTab !== '장거리' && document.getElementById('sel-airport').value === 'GMP'){
    _lastFareText = ''; // 요금 없음
    openExtra();
    return;
  }

  // 4. 시간
  if(!document.getElementById('inp-date').value){
    return pop(currentTab==='입국' ? '비행기 도착 시간을 입력해주세요' : '택시 탑승 시간을 입력해주세요');
  }
  // 과거 시간 체크
  const inputTime = new Date(document.getElementById('inp-date').value);
  if(inputTime < new Date()){
    return pop('🕐 날짜와 시간이 맞지 않습니다! 시간을 다시 확인해주세요 😊');
  }

  // 5. 인원
  if(parseInt(document.getElementById('inp-pax').textContent||0) < 1){
    return pop('탑승 인원을 입력해주세요');
  }

  // 6. 짐
  const cabinV = parseInt(document.getElementById('inp-cabin').textContent||0);
  const cargoV = parseInt(document.getElementById('inp-cargo').textContent||0);
  const golfV  = parseInt(document.getElementById('inp-golf').textContent||0);
  if(cabinV===0 && cargoV===0 && golfV===0){
    return pop('수화물을 입력해주세요');
  }

  // 7. 차량종류
  if(!document.getElementById('sel-veh').value){
    return pop('차량 종류를 선택해주세요');
  }

  // 8. 입국 항공편명
  if(currentTab==='입국' && !document.getElementById('inp-flight').value.trim()){
    return pop('항공편명을 입력해주세요');
  }
  if(currentTab==='입국'){
    const flightVal = document.getElementById('inp-flight').value.trim();
    if(flightVal && !/^[A-Z][A-Z0-9][0-9]{1,4}$/.test(flightVal)){
      return pop('항공편명을 다시 한번 확인해주세요\n예: KE123, OZ4567, 7C890');
    }
  }
  // ────────────────────────────────────────────────────────

  // 주소 없을 때 자동 검색
  if(!selectedAddr){
    const q = document.getElementById('inp-addr').value.trim();
    if(!q){
      document.getElementById('inp-addr').classList.add('shake');
      setTimeout(()=>document.getElementById('inp-addr').classList.remove('shake'),500);
      return;
    }
    // 카카오 지오코딩
    btn.disabled=true; btn.textContent='🔍 주소 검색 중...';
    const geoRes = await fetch(`/api/route?type=address&query=${encodeURIComponent(q)}`);
    const geoData = await geoRes.json();
    const found = geoData.documents && geoData.documents.length
      ? {display: geoData.documents[0].address_name || geoData.documents[0].road_address_name || q,
         lat: parseFloat(geoData.documents[0].y),
         lng: parseFloat(geoData.documents[0].x)}
      : null;
    if(!found){
      errEl.textContent = '주소를 찾을 수 없어요. 더 자세히 입력해 주세요.';
      errEl.classList.add('show');
      btn.disabled=false; btn.textContent='🔍 예상요금 확인하기';
      return;
    }
    selectedAddr = found;
  }

  // 입국 탭: 항공편명 필수 + 형식 검증
  if(currentTab === '입국'){
    const flight = document.getElementById('inp-flight').value.trim();
    const el = document.getElementById('inp-flight');
    if(!flight){
      el.classList.add('shake');
      el.style.borderColor='rgba(255,80,80,0.6)';
      setTimeout(()=>{el.classList.remove('shake');el.style.borderColor='';},600);
      btn.disabled=false; btn.textContent='🔍 예상요금 확인하기';
      return;
    }
    if(!/^[A-Z][A-Z0-9][0-9]{1,4}$/.test(flight)){
      el.classList.add('shake');
      el.style.borderColor='rgba(255,80,80,0.6)';
      setTimeout(()=>{el.classList.remove('shake');el.style.borderColor='';},600);
      pop('항공편명을 다시 한번 확인해주세요\n예: KE123, OZ4567, 7C890');
      btn.disabled=false; btn.textContent='🔍 예상요금 확인하기';
      return;
    }
  }

  btn.disabled=true; btn.textContent='📡 경로 계산 중...';

  const apId  = document.getElementById('sel-airport').value;

  // 전국장거리 처리
  if(currentTab === '장거리' || apId === 'LONG'){
    if(!selectedLong){
      const q = document.getElementById('inp-long').value.trim();
      if(!q){
        document.getElementById('inp-long').classList.add('shake');
        setTimeout(()=>document.getElementById('inp-long').classList.remove('shake'),500);
        btn.disabled=false; btn.textContent='🔍 예상요금 확인하기';
        return;
      }
      btn.disabled=true; btn.textContent='🔍 주소 검색 중...';
      const geoRes = await fetch(`/api/route?type=address&query=${encodeURIComponent(q)}`);
      const geoData = await geoRes.json();
      if(!geoData.documents||!geoData.documents.length){
        errEl.textContent='목적지 주소를 찾을 수 없어요.'; errEl.classList.add('show');
        btn.disabled=false; btn.textContent='🔍 예상요금 확인하기'; return;
      }
      selectedLong = {display:geoData.documents[0].address_name||q, lat:parseFloat(geoData.documents[0].y), lng:parseFloat(geoData.documents[0].x)};
    }
  }

  const ap = (currentTab==='장거리' || apId==='LONG')
    ? {name:selectedLong.display, lat:selectedLong.lat, lng:selectedLong.lng}
    : AIRPORTS[apId];
  const veh   = document.getElementById('sel-veh').value;
  const dateV = document.getElementById('inp-date').value;
  const hhmm      = getHHMM(dateV);
  // 입국: 비행기 도착 후 탑승까지 약 1시간 감안 → 할증 기준 1시간 앞당김
  const hmhmForNight = currentTab === '입국'
    ? getHHMM(new Date(new Date(dateV||Date.now()).getTime() + 60*60*1000))
    : hhmm;
  const nightMult = getNightMult(hmhmForNight);
  const baseFare  = getBaseFare(hmhmForNight);

  // 출국/장거리: selectedAddr → ap(목적지)
  // 입국: ap(공항) → selectedAddr
  const isDepFirst = currentTab==='출국' || currentTab==='장거리';
  const dep = isDepFirst ? {lat:selectedAddr.lat, lng:selectedAddr.lng} : {lat:ap.lat, lng:ap.lng};
  const arr = isDepFirst ? {lat:ap.lat, lng:ap.lng} : {lat:selectedAddr.lat, lng:selectedAddr.lng};
  const depName = isDepFirst ? selectedAddr.display : ap.name;
  const arrName = isDepFirst ? ap.name : selectedAddr.display;

  // ── 대형/콜밴/쏠라티 요금표 체크 ───────────────────────
  const vehVal2 = document.getElementById('sel-veh').value;
  if(vehVal2 === 'large' || vehVal2 === 'van' || vehVal2 === 'solar'){
    const addr2 = selectedAddr ? selectedAddr.display : '';
    const largeFare = getLargeFare(addr2, vehVal2);
    if(largeFare){
      const _wpCount0L = getWaypointAddrs().length;
      const _wpAdd0L = _wpCount0L * 10000;
      btn.disabled=false; btn.textContent='🔍 예상요금 확인하기';
      showFixedFare({amount: largeFare.amount * 10000 + _wpAdd0L, isSurcharge: largeFare.isSurcharge, wpFareAdd: _wpAdd0L, wpCount: _wpCount0L}, depName, arrName);
      showMap([], dep, arr, depName, arrName, 0, -1);
      return;
    } else {
      // 요금표에 없는 원거리
      btn.disabled=false; btn.textContent='🔍 예상요금 확인하기';
      document.getElementById('result-wrap').innerHTML = `
        <div class="result-box"><div class="ri">
          <div class="el">${depName} ──→ ${arrName}</div>
          <div class="ep" style="font-size:16px;line-height:1.8;color:#333333">
            🗺️ 먼 거리까지 이동하시는군요!<br>
            장거리는 상황에 따라 요금이 조금씩 달라서<br>
            카카오톡으로 문의주시면<br>
            친절하게 안내해드릴게요 😊
          </div>
          <div class="btn-row">
            <button class="kbtn main" onclick="openChatInquiry(true)">💬 카톡으로 문의하기</button>
          </div>
        </div></div>`;
      return;
    }
  }

  // ── 확정요금 지역 체크 ───────────────────────────────────
  const checkAddr = currentTab === '입국' ? selectedAddr.display : selectedAddr.display;
  const fixedFare = getFixedFare(checkAddr, hhmm);
  const _hasWp = getWaypointAddrs().length > 0;
  if(fixedFare){
    const _wpCount0 = getWaypointAddrs().length;
    const _wpAdd0 = _wpCount0 * 5000;
    btn.disabled=false; btn.textContent='🔍 예상요금 확인하기';
    showFixedFare({region: fixedFare.region, isSurcharge: fixedFare.isSurcharge, amount: fixedFare.amount + _wpAdd0, wpFareAdd: _wpAdd0, wpCount: _wpCount0}, depName, arrName);
    showMap([], dep, arr, depName, arrName, 0, -1);
    return;
  }

  try {
    // T-map 경로 API (실제 통행료 + 택시요금)
    const tmapRes = await fetch(
      `/api/route?type=route&startX=${dep.lng}&startY=${dep.lat}&endX=${arr.lng}&endY=${arr.lat}`
    );
    const tmapData = await tmapRes.json();
    if(!tmapData.features||!tmapData.features.length) throw new Error('경로 없음');

    const summary = tmapData.features[0].properties;
    let distKm  = summary.totalDistance / 1000;
    const durMin  = Math.round(summary.totalTime / 60);
    const toll    = summary.totalFare || 0;

    // ── 경유지 추가거리 계산 ──────────────────────────────
    const _wps = getWaypointAddrs();
    let _wpExtraKm = 0;
    let _wpFareAdd = 0;
    let _wpAllCoords = [];
    if (_wps.length > 0) {
      try {
        btn.textContent = '📍 경유지 계산 중...';
        // 경유지 좌표 획득
        const _wpCoords = [];
        for (const _wpa of _wps) {
          const _gr = await fetch('/api/route?type=address&query=' + encodeURIComponent(_wpa));
          const _gd = await _gr.json();
          if (_gd.documents && _gd.documents[0]) {
            _wpCoords.push({ lat: parseFloat(_gd.documents[0].y), lng: parseFloat(_gd.documents[0].x) });
          }
        }
        if (_wpCoords.length > 0) {
          // 경유지 포함 경로: dep → wp1 → wp2 → ... → arr
          let _wpDist = 0;
          let _prevPt = dep;
          for (const _wpc of _wpCoords) {
            const _wr = await fetch(`/api/route?type=route&startX=${_prevPt.lng}&startY=${_prevPt.lat}&endX=${_wpc.lng}&endY=${_wpc.lat}`);
            const _wd = await _wr.json();
            if (_wd.features && _wd.features[0]) {
              _wpDist += _wd.features[0].properties.totalDistance / 1000;
              const _seg = _wd.features.filter(f=>f.geometry&&f.geometry.type==='LineString').flatMap(f=>f.geometry.coordinates.map(c=>[c[1],c[0]]));
              _wpAllCoords = _wpAllCoords.concat(_seg);
            }
            _prevPt = _wpc;
          }
          const _lastR = await fetch(`/api/route?type=route&startX=${_prevPt.lng}&startY=${_prevPt.lat}&endX=${arr.lng}&endY=${arr.lat}`);
          const _lastD = await _lastR.json();
          if (_lastD.features && _lastD.features[0]) {
            _wpDist += _lastD.features[0].properties.totalDistance / 1000;
            const _lastSeg = _lastD.features.filter(f=>f.geometry&&f.geometry.type==='LineString').flatMap(f=>f.geometry.coordinates.map(c=>[c[1],c[0]]));
            _wpAllCoords = _wpAllCoords.concat(_lastSeg);
          }
          _wpExtraKm = Math.max(0, _wpDist - distKm);
          // 미터기 계산용으로 distKm 업데이트 (경유지 포함 거리로)
          if (veh === 'medium') distKm = _wpDist;

          // 미터기/확정요금 분기
          const _addrDisp = selectedAddr ? selectedAddr.display : '';
          let _isFixed = false;
          if (veh === 'medium') {
            // 중형: FIXED_FARE 지역 여부 확인
            _isFixed = getFixedFare(_addrDisp, hhmm) !== null;
          } else {
            // 대형/콜밴/쏠라티: 항상 확정요금
            _isFixed = true;
          }
          if (_isFixed) {
            const _wpUnitFare = veh === 'medium' ? 5000 : 10000;
            const _wpBaseFare = _wps.length * _wpUnitFare;
            const _wpDistFare = _wpExtraKm > 15 ? _wpUnitFare : 0;
            _wpFareAdd = _wpBaseFare + _wpDistFare;
          }
          // 미터기 지역 중형: 추가요금 없음 (거리로 자동 반영됨)
        }
      } catch(e) { console.warn('경유지 계산 오류:', e); }
    }

    // 경로 좌표 (지도용 + 시계외할증 계산용)
    const coords = tmapData.features
      .filter(f => f.geometry && f.geometry.type === 'LineString')
      .flatMap(f => f.geometry.coordinates.map(c => [c[1], c[0]]));

    const m = METER[veh];
    let totalFare, distFare, surchargeKm = 0, normalKm = distKm;
    let exitIdx = -1;

    // ── 입국/장거리 탭: 시계외할증 계산 ──────────────────
    if(currentTab === '입국' || currentTab === '장거리'){
      const destInZone = await isInSharedZoneAPI(arr.lat, arr.lng);
      if(!destInZone && coords.length > 0){
        btn.textContent='📍 구간 분석 중...';
        const exit = await findExitPointAPI(coords);
        exitIdx = exit.exitIdx;
        if(exitIdx >= 0){
          normalKm    = exit.normalKm;
          surchargeKm = Math.max(0, distKm - normalKm);
        }
      }
    }

    // 미터기 계산
    {
      const depMin    = Math.floor(hhmm/100)*60 + (hhmm%100);
      // 장거리: T-map 실제 소요시간 / 입출국: 야간 기준 예상시간
      const travelMin = currentTab === '장거리' ? durMin : getEstimatedMinutes(distKm);
      const borderMin = (surchargeKm > 0)
        ? depMin + travelMin * (normalKm / distKm)
        : depMin + travelMin;

      const normalFare    = calcSegmentFare(depMin, borderMin, normalKm, m.perKm, 1.0);
      const surchargeFare = calcSegmentFare(borderMin, depMin + travelMin, surchargeKm, m.perKm, 1.2);
      distFare = normalFare + surchargeFare;

      const baseFareNight = Math.round(m.base * nightMult / 100) * 100;
      totalFare = baseFareNight + distFare + toll;
    }

    totalFare += _wpFareAdd;
    showResult({depName, arrName, distKm, baseFare: m.base, distFare, toll, totalFare, nightMult, veh, surchargeKm, wpFareAdd: _wpFareAdd, wpExtraKm: _wpExtraKm, wpCount: _wps.length});
    const _mapCoords = (_wps.length > 0 && typeof _wpAllCoords !== 'undefined' && _wpAllCoords.length > 0) ? _wpAllCoords : coords;
    showMap(_mapCoords, dep, arr, depName, arrName, distKm, exitIdx);

  } catch(e){
    console.error('경로 오류:', e);
    errEl.textContent = '경로 오류: ' + e.message;
    errEl.classList.add('show');
  }

  btn.disabled=false; btn.textContent='🔍 예상요금 확인하기';
}

// ── 결과 표시 ─────────────────────────────────────────────
function getTimeRange(distKm){
  if(distKm < 50)  return '약 40~60분';
  if(distKm < 70)  return '약 50~80분';
  if(distKm < 90)  return '약 60~90분';
  if(distKm < 110) return '약 70~100분';
  return '약 80분~';
}

function showFixedFare({region, amount, isSurcharge, wpFareAdd, wpCount}, depName, arrName){
  var _cb = document.getElementById('btn-calc'); if(_cb) _cb.style.display='none';
  _lastFareText = `확정 ${amount.toLocaleString()}원`;
  const label = isSurcharge ? '🌙 야간요금' : '☀️ 일반요금';
  document.getElementById('result-wrap').innerHTML = `
    <div class="result-box"><div class="ri">
      <div class="el">${depName.split(' ').slice(0,3).join(' ')} ──→ ${arrName.split(' ').slice(0,3).join(' ')}</div>
      <div class="ep">
        <span class="price">${amount.toLocaleString()}원</span>
        ${isSurcharge ? `<span class="nb" style="background:#7c3aed">🌙 야간요금</span>` : ''}
      </div>
      <div class="em">💳 카드결제 가능</div>
      ${wpFareAdd > 0 ? `<div class="bd"><div class="br"><span class="k">경유 추가요금 (${wpCount}개)</span><span class="v">+${wpFareAdd.toLocaleString()}원</span></div></div>` : ''}
      <div class="nt">※ 실제 요금은 위 금액으로 정산됩니다.</div>
      <div class="btn-row">
        <button class="kbtn sub" onclick="openChatInquiry()">💬 채팅 문의</button>
        ${IS_BOOKING ? '' : '<button class="kbtn main" onclick="openExtra()">📋 예약하기 →</button>'}
      </div>
    </div></div>`;
  if(IS_BOOKING) setTimeout(()=>openExtra(), 100);
}

function showResult({depName,arrName,distKm,baseFare,distFare,toll,totalFare,nightMult,veh,surchargeKm,wpFareAdd,wpCount}){
  _lastFareText = `예상 ${totalFare.toLocaleString()}~${(totalFare+3000).toLocaleString()}원`;
  var _cb2 = document.getElementById('btn-calc'); if(_cb2) _cb2.style.display='none';
  // 요금확인 로그 Firebase 저장
  try {
    if(_fbDb) {
      var now = new Date();
      var dateKey = now.getFullYear()+'-'+(now.getMonth()+1<10?'0':'')+(now.getMonth()+1)+'-'+(now.getDate()<10?'0':'')+now.getDate();
      var _dv = (document.getElementById('inp-date')||{}).value || '';
      var _rideDate='', _rideHHMM='';
      if(_dv){
        var _dt=new Date(_dv);
        if(!isNaN(_dt)){
          _rideDate=_dt.getFullYear()+'-'+(_dt.getMonth()+1<10?'0':'')+(_dt.getMonth()+1)+'-'+(_dt.getDate()<10?'0':'')+_dt.getDate();
          _rideHHMM=(_dt.getHours()<10?'0':'')+_dt.getHours()+(_dt.getMinutes()<10?'0':'')+_dt.getMinutes();
        }
      }
      var _gv=function(id){ var e=document.getElementById(id); return e?(e.textContent||'0').trim():'0'; };
      // ── 예약하기와 동일한 콜카드 생성 (이름/전번만 빈칸) ──
      var _fPax   = parseInt(_gv('inp-pax'))||1;
      var _fCabin = parseInt(_gv('inp-cabin'))||0;
      var _fCargo = parseInt(_gv('inp-cargo'))||0;
      var _fGolf  = parseInt(_gv('inp-golf'))||0;
      var _fBag   = calcTotalBag(_fCabin, _fCargo, _fGolf);
      var _fAddr  = selectedAddr ? selectedAddr.display : '';
      var _fRegion= _fAddr ? extractRegion(_fAddr) : '미상';
      var _fVehC  = getVehCode(veh);
      var _fDir   = currentTab==='입국' ? '입' : '출';
      var _fNow   = _dv ? new Date(_dv) : new Date();
      var _fYY    = String(_fNow.getFullYear()).slice(2);
      var _fMMDD  = String(_fNow.getMonth()+1).padStart(2,'0')+String(_fNow.getDate()).padStart(2,'0');
      var _fHHMM  = String(_fNow.getHours()).padStart(2,'0')+String(_fNow.getMinutes()).padStart(2,'0');
      var _fDtype = veh==='medium' ? getDispatchType(_fPax, _fBag) : '';
      // 경고 (예약하기 동일 로직)
      var _fWarns=[];
      if(veh==='medium'){
        if(_fBag>=5) _fWarns.push('⚠️ 짐 확인요망');
        if(_fPax>=5) _fWarns.push('⚠️ 인원 확인요망 (중형선택)');
      } else if(veh==='large'){
        if(_fPax>=10) _fWarns.push('⚠️ 인원 확인요망');
        else if(_fPax>=8||_fBag>=6) _fWarns.push('⚠️ 인원/짐 확인요망');
      } else if(veh==='van'){
        if(_fBag>=9) _fWarns.push('⚠️ 짐 확인요망');
        if(_fPax>=5) _fWarns.push('⚠️ 인원 확인요망 (콜밴선택)');
      } else if(veh==='solar'){
        if(_fPax<10) _fWarns.push('⚠️ 인원 확인요망');
      }
      if(_dv){
        var _dep=new Date(_dv);
        var _td=new Date(); _td.setHours(0,0,0,0);
        var _tm=new Date(); _tm.setDate(_tm.getDate()+1); _tm.setHours(0,0,0,0);
        var _dd=new Date(_dep); _dd.setHours(0,0,0,0);
        if(_dd.getTime()===_td.getTime()) _fWarns.unshift(currentTab==='입국'?'❗❗ 당일입국':'❗❗ 당일출발');
        else if(_dd.getTime()===_tm.getTime()) _fWarns.unshift(currentTab==='입국'?'❗❗ 내일입국':'❗❗ 내일출발');
      }
      var _fWarnStr = _fWarns.length ? _fWarns.join('\n')+'\n' : '';
      var _fWpSuffix = getWaypointAddrs().length > 0 ? ' 경유' : '';
      var _fVehLabel = '';
      if(veh==='large') _fVehLabel = ' 대형';
      else if(veh==='van') _fVehLabel = ' 콜밴';
      else if(veh==='solar') _fVehLabel = ' 쏠라티';
      var _fTitle1 = _fVehC+' '+_fDir+' '+_fRegion+' '+_fYY+' '+_fMMDD+' '+_fHHMM+(_fDtype?' '+_fDtype:'')+_fVehLabel+_fWpSuffix;
      var _fTail = _fWarnStr+'❗요금확인\n'+_fTitle1+'\n채널>'+CH.code+'>';
      var _fWps = getWaypointAddrs();
      var _fExtra = { phone:'', name:'', carseat:'', picket:'', kakaoId:'', request:'', waypoint:_fWps.join(', '), waypoints:_fWps, tail:_fTail };
      var _fCardFull = buildCallCard(_fExtra);
      _fbDb.ref('fareLog/'+dateKey).push({
        channel: CH.code,
        dir: currentTab||'출국',
        dep: depName,
        arr: arrName,
        depDetail: ((document.getElementById('inp-detail')||{}).value||''),
        distKm: Math.round(distKm*10)/10,
        veh: veh,
        totalFare: totalFare,
        pax: String(_fPax),
        cargo: String(_fCargo),
        cabin: String(_fCabin),
        golf: String(_fGolf),
        rideDate: _rideDate,
        rideHHMM: _rideHHMM,
        title1: _fTitle1,
        tail: _fTail,
        body: _fCardFull,
        warns: _fWarns.join('\n'),
        createdAt: now.getTime()
      });
      // 요금확인 푸시 알림 (예약과 동일 방식)
      var _pRoute = String(depName||'').split(' ').slice(0,2).join(' ') + ' → ' + String(arrName||'');
      fetch('/api/push', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          action: 'send',
          title: '💰 [' + CH.name + '] 요금확인!',
          body: _pRoute + ' · ' + Number(totalFare||0).toLocaleString() + '원'
        })
      }).catch(function(){});
    }
  } catch(e) {}

  const nightLabel = nightMult===1.4 ? '심야할증 40%' : nightMult===1.2 ? '야간할증 20%' : '';
  const surLabel   = surchargeKm > 0 ? '시계외할증 20%' : '';
  document.getElementById('result-wrap').innerHTML = `
    <div class="result-box"><div class="ri">
      <div class="el">${depName.split(' ').slice(0,3).join(' ')} ──→ ${arrName.split(' ').slice(0,3).join(' ')}</div>
      <div class="ep">
        <span class="price">${totalFare.toLocaleString()}원 ~ ${(totalFare+3000).toLocaleString()}원</span>
        ${nightLabel?`<span class="nb">${nightLabel}</span>`:''}
        ${surLabel?`<span class="nb" style="background:#e53e3e">${surLabel}</span>`:''}
      </div>
      <div class="em">예상 ${getTimeRange(distKm)} · ${VNAMES[veh]} · 💳 카드결제 가능</div>
      <div class="bd">
        <div class="br"><span class="k">거리요금 (${distKm.toFixed(1)}km)</span><span class="v">${(baseFare + distFare).toLocaleString()}원</span></div>
        ${surchargeKm>0?`<div class="br"><span class="k" style="color:#fc8181">└ 시계외구간 ${surchargeKm.toFixed(1)}km (×1.2)</span><span class="v" style="color:#fc8181">포함</span></div>`:''}
        <div class="br"><span class="k">통행료</span><span class="v">+${toll.toLocaleString()}원</span></div>

// ── 꼬리 생성 ────────────────────────────────────────────
function extractRegion(addr){
  // 예외 지명 (더 유명한 지명 우선)
  const exceptions = ['동탄','분당','판교','일산','수지','기흥','별내'];
  for(const ex of exceptions){
    if(addr.includes(ex)) return ex;
  }
  // 서울 → 구 단위
  const seoulGu = addr.match(/서울[^시]*?([가-힣]+구)/);
  if(seoulGu) return seoulGu[1].replace('구','');
  // 광역시(인천/부산/대구/대전/광주/울산/세종) → 시 이름만 (구 무시)
  const metros = ['인천','부산','대구','대전','광주','울산','세종'];
  for(const m of metros){
    if(addr.includes(m)) return m;
  }
  // 경기/지방 → 시 단위 (청주/고양/수원 등)
  const si = addr.match(/([가-힣]+시)/);
  if(si) return si[1].replace('시','');
  // 구 단위
  const gu = addr.match(/([가-힣]+구)/);
  if(gu) return gu[1].replace('구','');
  return addr.split(' ')[1] || addr.split(' ')[0] || '미상';
}

function calcTotalBag(cabin, cargo, golf){
  return parseInt(cabin||0) + parseInt(cargo||0) + parseInt(golf||0)*2;
}

function getVehCode(veh){
  if(veh==='large') return '대';
  if(veh==='van')   return '콜';
  if(veh==='solar') return '쏠';
  return '중';
}

function getDispatchType(pax, totalBag){
  // 인원/캐리어 기준표
  const p = parseInt(pax), b = totalBag;
  if(p<=1){ if(b<=3) return 'G우선'; return 'EQ배차'; }
  if(p<=2){ if(b<=2) return 'G우선'; return 'EQ배차'; }
  if(p<=3){ if(b<=2) return 'GQE'; return 'EQ배차'; }
  if(p<=4){ if(b<=1) return 'GQE'; return 'EQ배차'; }
  return '';
}

function buildTail(extra, veh, pax, totalBag, addr, dateV, tab){
  const now = dateV ? new Date(dateV) : new Date();
  const yy   = String(now.getFullYear()).slice(2);
  const mmdd = String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  const hhmm2= String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
  const dir  = tab==='입국' ? '입' : '출';
  const region = extractRegion(addr);
  const vehCode = getVehCode(veh);
  const name = extra.name || '';
  const p = parseInt(pax);
  const hasExtra = !!(extra.carseat||extra.picket||extra.request);

  // 경고 메시지 배열 (중복 가능)
  const warns = [];

  // 김포공항 마크
  const apId = document.getElementById('sel-airport').value;
  if(apId === 'GMP'){
    warns.unshift('❗❗❗김포공항 확인요망');
  }

  // 긴급예약 체크 (3시간 이내)
  if(dateV){
    const depTime = new Date(dateV);
    const now = new Date();
    const diffMin = (depTime - now) / (1000 * 60);
    if(diffMin > 0 && diffMin <= 180){
      warns.unshift('❗❗❗긴급예약 확인요망');
    }
  }

  // 당일/내일 출발·입국 체크
  if(dateV){
    const depTime = new Date(dateV);
    const today = new Date();
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const depDateStr = depTime.toDateString();
    const todayStr = today.toDateString();
    const tomorrowStr = tomorrow.toDateString();
    if(depDateStr === todayStr){
      warns.unshift(tab==='입국' ? '❗❗ 당일입국' : '❗❗ 당일출발');
    } else if(depDateStr === tomorrowStr){
      warns.unshift(tab==='입국' ? '❗❗ 내일입국' : '❗❗ 내일출발');
    }
  }

  const _wpSuffix = getWaypointAddrs().length > 0 ? ' 경유' : '';

  if(veh==='medium'){
    const dtype = getDispatchType(pax, totalBag);
    if(totalBag >= 5)     warns.push('⚠️ 짐 확인요망');
    if(p >= 5)            warns.push('⚠️ 인원 확인요망 (중형선택)');
    const dtypeStr = dtype ? ' ' + dtype : '';
    line1 = `${vehCode} ${dir} ${region} ${yy} ${mmdd} ${hhmm2}${dtypeStr}${_wpSuffix}`;

  } else if(veh==='large'){
    line1 = `${vehCode} ${dir} ${region} ${yy} ${mmdd} ${hhmm2} 대형${_wpSuffix}`;
    if(p >= 10)           warns.push('⚠️ 인원 확인요망');
    else if(p>=8||totalBag>=6) warns.push('⚠️ 인원/짐 확인요망');

  } else if(veh==='van'){
    line1 = `${vehCode} ${dir} ${region} ${yy} ${mmdd} ${hhmm2} 콜밴${_wpSuffix}`;
    if(totalBag >= 9)      warns.push('⚠️ 짐 확인요망');
    if(p >= 5)            warns.push('⚠️ 인원 확인요망 (콜밴선택)');

  } else if(veh==='solar'){
    line1 = `${vehCode} ${dir} ${region} ${yy} ${mmdd} ${hhmm2} 쏠라티${_wpSuffix}`;
    if(p < 10)            warns.push('⚠️ 인원 확인요망');
  }

  // 추가사항
  if(hasExtra) warns.push('⚠️ 추가사항 확인요망');

  const warnStr = warns.length > 0 ? warns.join('\n') + '\n' : '';
  return warnStr + line1 + '\n채널>' + CH.code + '>' + name;
}

  const vehLabel = veh==='large' ? '대형' : veh==='van' ? '콜밴' : '중형';
  const dateObj2 = dateV ? new Date(dateV) : new Date();
  const datetimeStr = dateObj2.getFullYear() + '-'
    + String(dateObj2.getMonth()+1).padStart(2,'0') + '-'
    + String(dateObj2.getDate()).padStart(2,'0') + ' '
    + String(dateObj2.getHours()).padStart(2,'0') + ':'

  const airportVal = document.getElementById('sel-airport') ? document.getElementById('sel-airport').value : '';
  const callCardFull = extra.tail + buildCallCard(extra);

  try {
    const _pax2 = parseInt(document.getElementById('inp-pax').textContent)||0;
    const _cabin2 = parseInt(document.getElementById('inp-cabin').textContent||0);
    const _cargo2 = parseInt(document.getElementById('inp-cargo').textContent||0);
    const _golf2 = parseInt(document.getElementById('inp-golf').textContent||0);
    const _total2 = _cabin2+_cargo2+_golf2;
    const _tab2 = typeof currentTab !== 'undefined' ? currentTab : '';
    writeToFirebase(extra, document.getElementById('inp-date').value, _tab2, document.getElementById('sel-veh').value, _pax2, _cabin2, _cargo2, _golf2, _total2, addr, airportVal, document.getElementById('inp-flight').value||'', _lastFareText||'');

  const dateV   = document.getElementById('inp-date').value;
  const now     = dateV ? new Date(dateV) : new Date();
  const yy      = String(now.getFullYear()).slice(2);
  const mmdd    = String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  const hhmm2   = String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
  const dir     = currentTab==='입국' ? '입' : '출';
  const addr    = selectedAddr ? selectedAddr.display : '';
  const region  = addr ? extractRegion(addr) : '미상';
  const veh     = document.getElementById('sel-veh').value || 'medium';
  const vehCode = getVehCode(veh);
  const pax     = parseInt(document.getElementById('inp-pax').textContent||1);
  const cabin   = parseInt(document.getElementById('inp-cabin').textContent||0);
  const cargo   = parseInt(document.getElementById('inp-cargo').textContent||0);
  const golf    = parseInt(document.getElementById('inp-golf').textContent||0);

  const dtype   = veh==='medium' ? getDispatchType(pax, totalBag) : '';

  // 경고 메시지 (예약하기와 동일 로직)
  const warns = [];

    if(totalBag >= 5)  warns.push('⚠️ 짐 확인요망');
    if(pax >= 5)       warns.push('⚠️ 인원 확인요망 (중형선택)');

function doCopyFull(id){
  const text = _fullCardText || document.getElementById(id).innerText;
  const btn = document.getElementById('copybtn');
  const copy = ()=>{
    document.getElementById(id).style.display='none';
    btn.style.display='none';
    document.getElementById('modal-guide').classList.add('show');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(copy).catch(()=>fallbackCopy(text, copy));
  } else { fallbackCopy(text, copy); }
}

function doCopy(id){
  const el = document.getElementById(id);
  const fullData = el.getAttribute('data-full');
  const text = fullData ? decodeURIComponent(fullData) : el.innerText;
  const btn = document.getElementById('copybtn');
  const copy = ()=>{
    document.getElementById(id).style.display='none';
    btn.style.display='none';
    document.getElementById('modal-guide').classList.add('show');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(copy).catch(()=>fallbackCopy(text, copy));
  } else { fallbackCopy(text, copy); }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); cb(); } catch(e){}
  document.body.removeChild(ta);
}
function onPasteCheck(el){
  const btn = document.getElementById('kakao-go-btn');
  if(el.checked){
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
  } else {
    btn.disabled = true;
    btn.style.opacity = '0.4';
    btn.style.cursor = 'not-allowed';
  }
}

function gotoKakao(){
  window.open(CH.kakao,'_blank');
}

// ── 지도 ──────────────────────────────────────────────────
function showMap(coords, dep, arr, depName, arrName, distKm, exitIdx){
  if(leafMap){ leafMap.remove(); leafMap=null; }
  document.getElementById('map-container').innerHTML = `
    <div class="map-wrap">
      <div class="map-hdr">
        <span>🗺️</span>
        <span class="map-hdr-txt">${depName.split(' ').slice(0,2).join(' ')} → ${arrName}</span>
        <span class="map-hdr-dist">${distKm.toFixed(1)}km</span>
      </div>
      <div id="map-load" class="map-load"><div class="spinner"></div><span>지도 불러오는 중...</span></div>
      <div id="map" style="display:none"></div>
    </div>`;
  setTimeout(()=>{
    document.getElementById('map-load').style.display='none';
    document.getElementById('map').style.display='block';
    leafMap = L.map('map',{zoomControl:true,attributionControl:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(leafMap);

    let mainLine;
    if(exitIdx > 0 && exitIdx < coords.length){
      // 공동사업구역 내 구간: 초록
      const normalCoords    = coords.slice(0, exitIdx + 1);
      // 시계외할증 구간: 빨강
      const surchargeCoords = coords.slice(exitIdx);
      const line1 = L.polyline(normalCoords,   {color:'#22c55e', weight:5, opacity:.9}).addTo(leafMap);
      const line2 = L.polyline(surchargeCoords,{color:'#ef4444', weight:5, opacity:.9}).addTo(leafMap);
      // 빨간 구간 범례
      const mid = surchargeCoords[Math.floor(surchargeCoords.length/2)];
      if(mid) L.marker(mid,{icon:L.divIcon({
        html:`<div style="background:#ef4444;color:#333333;border-radius:4px;padding:2px 5px;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.4)">시계외할증</div>`,
        iconAnchor:[30,10],className:''
      })}).addTo(leafMap);
      mainLine = L.featureGroup([line1, line2]);
    } else {
      mainLine = L.polyline(coords,{color:'#22c55e',weight:5,opacity:.9}).addTo(leafMap);
    }

    addMarker(dep.lat,dep.lng,'출','#3b82f6',depName);
    addMarker(arr.lat,arr.lng,'착','#ef4444',arrName);
    try {
      const _bounds = mainLine.getBounds();
      if (_bounds && _bounds.isValid()) {
        leafMap.fitBounds(_bounds, {padding:[18,18]});
      } else {
        leafMap.setView([dep.lat, dep.lng], 11);
      }
    } catch(e) {
      leafMap.setView([dep.lat, dep.lng], 11);
    }
  },100);
}

function addMarker(lat,lng,label,color,name){
  const icon = L.divIcon({
    html:`<div style="background:${color};color:#333333;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4)">${label}</div>`,
    iconSize:[30,30],iconAnchor:[15,15],className:''
  });
  L.marker([lat,lng],{icon}).bindPopup(`<b>${label==='출'?'출발':'도착'}</b><br>${name}`,{closeButton:false}).addTo(leafMap);
}
</script>
