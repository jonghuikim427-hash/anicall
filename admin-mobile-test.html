<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공유 테스트</title>
<style>
body { font-family: sans-serif; padding: 30px; background: #f5f5f5; }
.btn {
  display: block; width: 100%; padding: 16px;
  background: #f5b800; border: none; border-radius: 10px;
  font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 16px;
}
.result { padding: 12px; background: #fff; border-radius: 8px; font-size: 13px; color: #555; }
</style>
</head>
<body>

<h3>📤 공유 기능 테스트</h3>

<button class="btn" onclick="testShare()">📤 카카오톡으로 공유해보기</button>

<div class="result" id="result">버튼 눌러서 테스트해주세요!</div>

<script>
async function testShare() {
  var text = '중 출 강동 26 0520 0900 G우선\n채널>애니>테스트\n\n🚖출국택시 예약\n1️⃣출발일자 : 5월 20일\n2️⃣탑승시간 : 오전 9시\n3️⃣출발지 : 서울 강동구 테스트\n📌예약번호 05209908';

  if (navigator.share) {
    try {
      await navigator.share({ text: text });
      document.getElementById('result').textContent = '✅ 공유 성공!';
    } catch(e) {
      document.getElementById('result').textContent = '취소됨: ' + e.message;
    }
  } else {
    document.getElementById('result').textContent = '❌ 이 브라우저는 공유 기능을 지원하지 않아요. 모바일 크롬/사파리에서 테스트해주세요!';
  }
}
</script>
</body>
</html>
