<body>
<div id="app">
  <div class="hdr">
    <h1>🚖 애니콜택시 관리자</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="last-up" id="last-up"></span>
      <button class="btn-rfs" onclick="manualRefresh()">↺ 새로고침</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="go(0)">확정대기 최신<span class="tc" id="cnt0">0</span></button>
    <button class="tab" onclick="go(1)">확정대기 오래된거<span class="tc" id="cnt1">0</span></button>
    <button class="tab" onclick="go(2)">당일배차방<span class="tc" id="cnt2">0</span></button>
    <button class="tab" onclick="go(3)">배차완료방<span class="tc" id="cnt3">0</span></button>
    <button class="tab" onclick="go(4)">달력</button>
  </div>
  <div class="tab-hdr" id="tab-hdr">① 확정대기 최신방</div>
  <div class="main" id="main">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px">🔥 Firebase 연결 중...</div>
  </div>
</div>

<script>
// ── Firebase 설정 ──────────────────────────────────────────
var firebaseConfig = {
  apiKey: "AIzaSyAYaOtA5ztXwUz-ZfSyQAvUt65Oe-GvmWE",
  authDomain: "anicall-taxi.firebaseapp.com",
  databaseURL: "https://anicall-taxi-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "anicall-taxi",
  storageBucket: "anicall-taxi.firebasestorage.app",
  messagingSenderId: "1043913713685",
  appId: "1:1043913713685:web:e1ee0e61fd3f3f2332461c"
};
// ── 상태 ──────────────────────────────────────────────────
var allData = [];
var currentTab = 0;
var selectedCard = null;
var searchQuery = '';
var driverMap = {};   // {id: {driver, kakao, driverPhone, driverVehicle, driverVehicleNum}}
var baechaText = '';
var rebTarget = null;
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();
var editingCard = null;
var baechaDateFilter = '';

var TAB_HDRS = [
  '① 확정대기 최신방',
  '② 확정대기 오래된방 (30분+ 경과 · 24시간 후 자동삭제)',
  '③ 당일 배차방',
  '④ 당일 배차완료방',
  '⑤ 달력'
];

var db = null;

function manualRefresh() {
  var el = document.getElementById('last-up');
  if (el) el.textContent = '갱신됨 · ' + new Date().toLocaleTimeString('ko-KR');
  render();
}

// ── 10분 경과 자동이동 ────────────────────────────────────
function autoMoveOld() {
  var now = Date.now();
  allData.forEach(function(r) {
    if (r.status !== '대기') return;
    var t = r.createdAt || 0;
    if ((now - t) > 30 * 60 * 1000) {
      db.ref('cards/' + r.id).update({ status: '대기_오래됨' });
    }
  });
}

// ── 탭 전환 ───────────────────────────────────────────────
function go(n) {
  currentTab = n;
  document.querySelectorAll('.tab').forEach(function(t, i) {
    t.className = 'tab' + (i === n ? ' on' : '');
  });
  selectedCard = null; searchQuery = ''; rebTarget = null; editingCard = null;
  render();
}

// ── 렌더 ──────────────────────────────────────────────────
function render() {
  updateCounts();
  document.getElementById('tab-hdr').textContent = TAB_HDRS[currentTab];
  var m = document.getElementById('main');
  m.innerHTML = '';
  if (currentTab === 0 || currentTab === 1) renderConfirm(m);
  else if (currentTab === 2) renderBaecha(m);
  else if (currentTab === 3) renderBaechaComplete(m);
  else renderCalendar(m);
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate());
}
function p2(n) { return n < 10 ? '0'+n : ''+n; }

function updateCounts() {
  var c = [0,0,0,0];
  var today = todayStr();
  allData.forEach(function(r) {
    if (r.status === '대기') c[0]++;
    else if (r.status === '대기_오래됨') c[1]++;
    else if (r.status === '확정') c[2]++;
    else if (r.status === '배차완료' || r.status === '재배차완료') c[3]++;
  });
  for (var i = 0; i < 4; i++) {

// ── 유틸 ──────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getWarnings(r) {
  var warns = [];
  var tail = r.tail || '';
  tail.split('\n').forEach(function(line) {
    var t = line.trim();
    if (t.indexOf('⚠️') === 0 || t.indexOf('❗') === 0) warns.push(t);
  });
  return warns;
}

function warnBadges(r) {
  var warns = getWarnings(r);
  if (!warns.length) return '';
  return warns.map(function(w){
    var isUrgent = w.indexOf('❗') === 0;
    var bg = isUrgent ? '#fce4ec' : '#fff3e0';
    var color = isUrgent ? '#b71c1c' : '#e65100';
    return '<span style="background:'+bg+';color:'+color+';border-radius:3px;padding:1px 4px;font-size:9px;font-weight:700;margin-right:2px">'+esc(w)+'</span>';
  }).join('');
}

function cardLabel(r) { return r.title1 || r.resNum || '(카드)'; }

function fmtElapsed(ts) {
  if (!ts) return '';
  var diff = Math.floor((Date.now() - ts) / 60000);
  return diff < 60 ? diff + '분 경과' : Math.floor(diff/60) + '시간 경과';
}

function elClass(ts) {
  if (!ts) return 'e1';
  return Math.floor((Date.now()-ts)/60000) >= 60 ? 'e2' : 'e1';
}

function getDups(r) {
  if (!r.phone) return [];
  return allData.filter(function(x) { return x.phone === r.phone && x.id !== r.id; });
}

    rh += '차량번호: '+esc(selectedCard.driverVehicleNum||'-');
    rh += '</div></div>';

    rh += '<div class="info-box org"><div class="info-box-title">손님 정보</div>';
    rh += '<div class="info-box-body">';

}

// ══════════ 탭 4: 달력 ════════════════════════════════════
function renderCalendar(container) {
  var outer = document.createElement('div'); outer.className = 'cal-outer';
  var wrap = document.createElement('div'); wrap.className = 'cal-wrap';
  var monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var h = '<div class="cal-top"><div class="cal-title">'+calYear+'년 '+monthNames[calMonth]+'</div>';
  h += '<div><button class="cal-nav-btn" onclick="calPrev()">◀</button><button class="cal-nav-btn" onclick="calNext()">▶</button></div></div>';
  h += '<table class="cal"><tr>';
  ['일','월','화','수','목','금','토'].forEach(function(d){h+='<th>'+d+'</th>';});
  h += '</tr><tr>';
  var firstDay = new Date(calYear,calMonth,1).getDay();
  var lastDate = new Date(calYear,calMonth+1,0).getDate();
  var col = 0;
  for (var i=0;i<firstDay;i++){h+='<td class="cal-cell"></td>';col++;}
  for (var d=1;d<=lastDate;d++) {
    var dateStr2 = calYear+'-'+p2(calMonth+1)+'-'+p2(d);
    var dow = new Date(calYear,calMonth,d).getDay();
    var isToday = dateStr2===todayStr();
    var cls='cal-cell'+(isToday?' today':'')+(dow===0?' sun':'')+(dow===6?' sat':'');
    h+='<td class="'+cls+'">';
    h+='<div class="cal-day">'+d+'</div>';
    var dayCards = allData.filter(function(r){return r.rideDate===dateStr2;});
    dayCards.slice(0,3).forEach(function(r){
      var isDone=r.status==='배차완료'||r.status==='재배차완료';
      h+='<div class="cal-entry '+(isDone?'done':'wait')+'">'+esc(r.title1?r.title1.split(' ').slice(0,3).join(' '):'')+'</div>';
    });
    if(dayCards.length>3)h+='<div class="cal-more">+'+(dayCards.length-3)+'개</div>';
    h+='</td>';
    col++;
    if(col===7&&d<lastDate){h+='</tr><tr>';col=0;}
  }
  h+='</tr></table>';
  h+='<div class="cal-legend">';
  h+='<div class="cal-leg"><div class="cal-leg-dot" style="background:#bbdefb"></div>배차대기</div>';
  h+='<div class="cal-leg"><div class="cal-leg-dot" style="background:#c8e6c9"></div>기사매칭완료</div>';
  h+='<div class="cal-leg"><div class="cal-leg-dot" style="background:#fff9e6;border:1px solid #ffe082"></div>오늘</div>';
  h+='</div>';
  wrap.innerHTML = h;
  outer.appendChild(wrap);
  container.appendChild(outer);
}

function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}render();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}render();}

function updDrv(id,field,val){

  if(field==='driver'){
    var di=document.getElementById('drv-'+id);

function doBaechaCard(id){
  var r=allData.find(function(x){return x.id===id;});
  if(!r)return;
  var dm=driverMap[id]||{};
  if(!dm.driver){alert('기사 이름을 입력해주세요.');return;}
  db.ref('cards/'+id).update({
    status:'배차완료',
    driverName:dm.driver||'',
    driverKakao:dm.kakao||'',
    driverPhone:dm.driverPhone||'',
    driverVehicleType:dm.driverVehicle||'',
    driverVehicleNum:dm.driverVehicleNum||''
  });
}

function doAutoMatch(){
  var ta=document.getElementById('baecha-ta');
  if(!ta)return;
  baechaText=ta.value;
  // 반드시 renderBaecha와 동일한 필터+정렬 적용
  var list=allData.filter(function(r){
    if(r.status!=='확정') return false;
    if(baechaDateFilter && r.rideDate!==baechaDateFilter) return false;
    return true;
  });
  list.sort(function(a,b){
    return (a.rideDate||'').localeCompare(b.rideDate||'')||(a.rideHHMM||'').localeCompare(b.rideHHMM||'');
  });
  ta.value.split('\n').forEach(function(line){
    var m=line.match(/^(\d+)[.\s]\s*(.+)/);
    if(!m)return;
    var num=parseInt(m[1]),name=m[2].trim();
    if(num>=701&&num<=700+list.length){
      var r=list[num-701];
      if(r){
        if(!driverMap[r.id])driverMap[r.id]={driver:'',kakao:'',driverPhone:'',driverVehicle:'',driverVehicleNum:''};
        driverMap[r.id].driver=name;
      }
    }
  });
  render();
}

function doResetMatch(){
  if(!confirm('매칭을 초기화할까요?'))return;
  driverMap={};baechaText='';render();
}

  el.style.cssText = 'position:fixed;top:-9999px';

function saveEdit(id) {
  var t1 = document.getElementById('edit-title1');
  var t2 = document.getElementById('edit-title2');
  var body = document.getElementById('edit-body');
  if (!t1 || !body) return;
  var newTitle1 = t1.value.trim();
  var newTitle2 = t2 ? t2.value.trim() : '';
  var newBody = body.value;
  // tail 재조합
  var newTail = newTitle1 + (newTitle2 ? '\n' + newTitle2 : '');
  db.ref('cards/'+id).update({
    title1: newTitle1,
    title2: newTitle2,
    tail: newTail,
    body: newBody
  }).then(function() {
    editingCard = null;
    render();
  });
}

function doCopy(elId,btnId,noteId){
  var el=document.getElementById(elId);
  if(!el)return;
  var text=el.tagName==='TEXTAREA'?el.value:el.innerText;
  var btn=document.getElementById(btnId);
  var note=document.getElementById(noteId);
  var done=function(){
    if(btn){btn.className='btn-copy done';btn.textContent='복사됨✓';}
    if(note)note.textContent='→ 복사후 사라짐';
    setTimeout(function(){if(btn){btn.className='btn-copy';btn.textContent='복사';}if(note)note.textContent='';},2000);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){fbCopy(text,done);});
  }else{fbCopy(text,done);}
}

function fbCopy(text,cb){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(ta);
}

window.onload = function() {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    db.ref('cards').on('value', function(snapshot) {
      allData = [];
      snapshot.forEach(function(child) {
        var card = child.val();
        card.id = child.key;
        allData.push(card);
      });
      autoMoveOld();
      render();
      var el = document.getElementById('last-up');
      if (el) el.textContent = '실시간 · ' + new Date().toLocaleTimeString('ko-KR');
    });
  } catch(e) {
    document.getElementById('main').innerHTML = '<div style="padding:40px;color:#e05555">❌ Firebase 연결 실패: ' + e.message + '</div>';
  }
};
