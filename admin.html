<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>애니콜택시 관리자</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
body{background:#f0f0f0;font-size:13px}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── 헤더 ── */
.hdr{background:#1a2a4a;color:#FFD700;padding:7px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr h1{font-size:15px;font-weight:700}
.btn-rfs{background:rgba(255,215,0,0.2);border:1px solid #FFD700;color:#FFD700;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.last-up{font-size:10px;color:rgba(255,215,0,0.7)}

/* ── 탭바 ── */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;flex-shrink:0}
.tab{flex:1;padding:8px 2px;text-align:center;cursor:pointer;font-size:10px;color:#888;border:none;border-bottom:3px solid transparent;background:none;font-family:inherit;line-height:1.3}
.tab.on{color:#1a2a4a;border-bottom-color:#FFD700;font-weight:700}
.tc{display:inline-block;background:#e0e0e0;color:#666;border-radius:10px;padding:1px 5px;font-size:9px;margin-left:2px}
.tab.on .tc{background:#FFD700;color:#1a2a4a}

/* ── 탭 헤더바 ── */
.tab-hdr{background:#1a2a4a;color:#fff;padding:6px 14px;font-size:13px;font-weight:700;flex-shrink:0}

/* ── 메인 ── */
.main{flex:1;display:flex;overflow:hidden}

/* ══════════ 탭 0/1 공통 ══════════ */
.t01-left{width:300px;min-width:240px;display:flex;flex-direction:column;border-right:1px solid #ddd;background:#f7f7f7;overflow:hidden}
.t01-right{flex:1;display:flex;flex-direction:column;background:#fff;overflow:hidden}

/* 고정 카드 */
.pin-area{background:#fff;border-bottom:2px solid #e0e0e0;padding:8px;flex-shrink:0}
.pin-title{font-size:10px;font-weight:700;color:#1a2a4a;margin-bottom:5px}
.pin-card{border:2px solid #1a2a4a;border-radius:7px;padding:8px 10px;cursor:pointer;background:#eef2ff}
.pin-tail{font-size:14px;font-weight:700;color:#1a2a4a;line-height:1.3;margin-bottom:3px}
.pin-sub{font-size:10px;color:#777;line-height:1.7}
.pin-dup{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap}
.pin-dup-lbl{font-size:10px;color:#aaa;flex-shrink:0}
.dup-btn{padding:2px 7px;background:#fff3e0;border:1px solid #ffcc80;border-radius:10px;font-size:10px;color:#e65100;cursor:pointer}
.pin-empty{text-align:center;color:#ccc;font-size:11px;padding:8px 0}

/* 카드 목록 */
.list-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.list-title{font-size:10px;font-weight:700;color:#888;padding:5px 9px;background:#f0f0f0;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.list-body{flex:1;overflow-y:auto}
.lc{display:flex;align-items:center;padding:7px 9px;border-bottom:1px solid #f0f0f0;cursor:pointer;gap:5px;background:#fff;transition:background .1s}
.lc:hover{background:#f5f7ff}
.lc.on{background:#eef2ff;border-left:3px solid #1a2a4a}
.lc-new{background:#e8fce8!important}
.lc-label{flex:1;font-size:12px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-new{background:#1a2a4a;color:#FFD700;border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700;flex-shrink:0}
.badge-wait{background:#e3f2fd;color:#1565c0;border-radius:10px;padding:2px 7px;font-size:10px;font-weight:700;flex-shrink:0}
.elapsed{border-radius:10px;padding:2px 7px;font-size:10px;font-weight:700;flex-shrink:0;white-space:nowrap}
.e1{background:#fff3e0;color:#e65100}
.e2{background:#fce4ec;color:#b71c1c}
.list-note{font-size:10px;color:#aaa;text-align:center;padding:5px;border-top:1px solid #eee;flex-shrink:0}

/* 오른쪽 패널 */
.rp-search{padding:7px 10px;border-bottom:1px solid #eee;flex-shrink:0}
.rp-search input{width:100%;padding:6px 12px;border:1px solid #ccc;border-radius:20px;font-size:11px;outline:none;font-family:inherit}
.rp-search input:focus{border-color:#1a2a4a}
.rp-body{flex:1;overflow-y:auto;padding:12px}
.det-title{font-size:12px;font-weight:700;color:#1a2a4a;padding-bottom:6px;border-bottom:2px solid #e0e0e0;margin-bottom:8px}
.det-summary{font-size:12px;color:#555;margin-bottom:7px;line-height:1.7;padding:6px 8px;background:#f9f9f9;border-radius:5px}
.det-tail-line{font-size:13px;font-weight:700;color:#1a2a4a;margin-bottom:2px}
.det-channel{font-size:11px;color:#888;margin-bottom:8px}
.det-item{font-size:12px;color:#444;line-height:2;white-space:nowrap}
.det-sys{font-size:11px;color:#777;line-height:1.9;margin-top:4px}
.det-req{font-size:11px;color:#e65100;margin-top:5px;padding:5px 7px;background:#fff8f0;border-left:3px solid #ffcc80;border-radius:3px}
.det-empty{text-align:center;color:#ccc;padding:50px 20px;font-size:13px}

/* 카카오 입력 */
.kk-section{margin-top:12px;padding-top:10px;border-top:1px solid #eee}
.kk-label{font-size:11px;font-weight:700;color:#1a2a4a;margin-bottom:5px}
.kk-inp{width:100%;padding:9px 11px;border:1.5px solid #FFD700;border-radius:7px;font-size:13px;font-family:inherit;outline:none}
.kk-inp:focus{border-color:#c8880a}
.kk-btns{display:flex;gap:6px;margin-top:7px}
.btn-confirm{flex:2;padding:9px;background:#1a2a4a;color:#FFD700;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.btn-confirm:disabled{background:#ccc;color:#fff;cursor:not-allowed}
.btn-close2{flex:1;padding:9px;background:#f0f0f0;color:#666;border:1px solid #ddd;border-radius:6px;font-size:12px;cursor:pointer}

/* ══════════ 탭 2: 당일배차방 ══════════ */
.t2-left{width:33%;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.t2-mid{width:28%;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden;background:#f8f8f8}
.t2-right{flex:1;overflow-y:auto;padding:10px;background:#fff}
.sec-title{font-size:10px;font-weight:700;color:#888;padding:6px 10px;background:#f0f0f0;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.t2-list{flex:1;overflow-y:auto}

.bc-row{display:flex;align-items:center;padding:6px 7px;border-bottom:1px solid #f0f0f0;gap:4px;cursor:pointer;background:#fff;transition:background .1s}
.bc-row:hover{background:#f5f7ff}
.bc-row.on{background:#eef2ff}
.bc-num{width:28px;height:28px;background:#1a2a4a;color:#FFD700;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.bc-label{flex:1;font-size:11px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bc-drv{width:68px;padding:4px 5px;border:1px solid #e0e0e0;border-radius:4px;font-size:11px;font-family:inherit;background:#fff;text-align:center}
.bc-drv.filled{background:#fff9c4;border-color:#f5b800;font-weight:700}
.bc-kak{width:55px;padding:4px 5px;border:1px solid #e0e0e0;border-radius:4px;font-size:11px;font-family:inherit;background:#fff;text-align:center}
.bc-done{padding:4px 8px;background:#1a2a4a;color:#FFD700;border:none;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}

.t2-mid-body{flex:1;overflow-y:auto;padding:8px}
.ta-box{width:100%;height:90px;padding:7px;border:1px solid #ccc;border-radius:6px;font-size:11px;font-family:'Malgun Gothic',sans-serif;resize:none;outline:none}
.ta-box:focus{border-color:#1a2a4a}
.t2-btn-row{display:flex;gap:6px;margin-top:6px}
.btn-match{flex:1;padding:7px;background:#1a2a4a;color:#FFD700;border:none;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer}
.btn-reset{flex:1;padding:7px;background:#fff;color:#555;border:1px solid #ccc;border-radius:5px;font-size:12px;cursor:pointer}
.card-preview{margin-top:10px;background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px}
.card-preview-title{font-size:10px;font-weight:700;color:#888;margin-bottom:5px}
.card-preview-body{font-size:11px;color:#333;line-height:1.8}

.msg-box{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:10px;margin-bottom:10px}
.msg-box-title{font-size:11px;font-weight:700;color:#555;margin-bottom:6px}
.msg-content{font-size:11px;color:#444;line-height:1.7;padding:7px;background:#f8f8f8;border-radius:5px;white-space:pre-wrap}
.msg-ta{width:100%;padding:7px;border:1px solid #eee;border-radius:5px;font-size:11px;font-family:inherit;resize:none;height:65px}
.msg-box.org{border-color:#ffcc80}
.msg-box.org .msg-box-title{color:#e65100}
.btn-copy{margin-top:6px;padding:5px 12px;background:#1a2a4a;color:#FFD700;border:none;border-radius:4px;font-size:11px;cursor:pointer}
.btn-copy.done{background:#22c55e;color:#fff}
.copy-note{margin-left:8px;font-size:10px;color:#aaa}

/* ══════════ 탭 3: 배차완료방 ══════════ */
.t3-left{width:35%;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.t3-mid{width:24%;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden;padding:10px;background:#f8f8f8}
.t3-right{flex:1;overflow-y:auto;padding:10px;background:#fff}
.t3-list{flex:1;overflow-y:auto}

.bcd-row{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer;gap:6px;background:#fff;transition:background .1s}
.bcd-row:hover{background:#f5faf5}
.bcd-row.on{background:#e8f5e9}
.bcd-num{width:30px;height:30px;background:#2e7d32;color:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.bcd-title{flex:1;font-size:12px;font-weight:700;color:#1a2a4a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcd-drv{font-size:11px;color:#2e7d32;font-weight:700;flex-shrink:0}
.btn-bcd-ok{padding:3px 8px;background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;border-radius:4px;font-size:10px;cursor:default;font-weight:700;flex-shrink:0}
.btn-reb{padding:3px 8px;background:#fff3e0;color:#e65100;border:1px solid #ffcc80;border-radius:4px;font-size:10px;cursor:pointer;font-weight:700;flex-shrink:0}
.btn-reb:hover{background:#ffe0b2}
.reb-row{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:11px}
.reb-new{color:#e65100;font-weight:700}
.reb-done-badge{background:#e8f5e9;color:#2e7d32;border-radius:3px;padding:1px 5px;font-size:10px;font-weight:700}
.reb-note{font-size:10px;color:#aaa;padding-top:1px}

/* 재배차 확인 */
.reb-confirm{background:#fff8e1;border:2px solid #f5b800;border-radius:9px;padding:13px;margin-bottom:10px}
.reb-confirm-title{font-size:13px;font-weight:700;color:#c8880a;margin-bottom:5px}
.reb-confirm-sub{font-size:12px;color:#555;margin-bottom:11px;line-height:1.6}
.reb-confirm-btns{display:flex;gap:8px}
.btn-reb-yes{flex:1;padding:9px;background:#1a2a4a;color:#FFD700;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.btn-reb-no{flex:1;padding:9px;background:#f0f0f0;color:#555;border:none;border-radius:6px;font-size:12px;cursor:pointer}

/* 폰 카드 */
.phone-preview-title{font-size:10px;font-weight:700;color:#888;margin-bottom:8px}
.phone-card{background:#fff;border:2px solid #333;border-radius:16px;padding:14px 12px;min-height:200px;position:relative}
.phone-card-head{width:50px;height:6px;background:#e0e0e0;border-radius:3px;margin:0 auto 14px}
.phone-card-title{font-size:13px;font-weight:700;color:#1a2a4a;margin-bottom:6px}
.phone-card-body{font-size:11px;color:#555;line-height:1.8}
.phone-card-empty{text-align:center;color:#ccc;font-size:11px;padding:40px 0}

/* 기사/손님 정보 */
.info-box{background:#fff;border:2px solid #1a2a4a;border-radius:8px;padding:10px;margin-bottom:10px}
.info-box-title{font-size:11px;font-weight:700;color:#1a2a4a;margin-bottom:6px}
.info-box-body{font-size:12px;color:#333;line-height:1.9}
.info-box.org{border-color:#ffcc80}
.info-box.org .info-box-title{color:#e65100}

/* ══════════ 탭 4: 달력 ══════════ */
.cal-outer{flex:1;overflow-y:auto;padding:12px;background:#f5f5f5}
.cal-wrap{background:#fff;border-radius:8px;padding:14px}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-size:15px;font-weight:700;color:#1a2a4a}
.cal-nav-btn{padding:4px 11px;background:#f0f0f0;border:none;border-radius:4px;cursor:pointer;font-size:13px;margin-left:4px}
.cal-nav-btn:hover{background:#ddd}
table.cal{width:100%;border-collapse:collapse}
table.cal th{text-align:center;font-size:11px;color:#888;padding:4px;font-weight:700}
table.cal th:first-child{color:#e53935}
table.cal th:last-child{color:#1565c0}
.cal-cell{vertical-align:top;border:1px solid #eee;padding:4px;min-height:72px;cursor:pointer}
.cal-cell:hover{background:#fafafa}
.cal-cell.today{background:#fff9e6}
.cal-day{font-size:11px;font-weight:700;color:#444}
.cal-cell.sun .cal-day{color:#e53935}
.cal-cell.sat .cal-day{color:#1565c0}
.cal-entry{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:1px 3px;margin-top:2px}
.cal-entry.wait{background:#bbdefb;color:#1a237e}
.cal-entry.done{background:#c8e6c9;color:#1b5e20}
.cal-more{font-size:10px;color:#aaa;margin-top:1px}
.cal-legend{display:flex;gap:16px;padding-top:8px;border-top:1px solid #eee;margin-top:8px}
.cal-leg{display:flex;align-items:center;gap:4px;font-size:11px;color:#666}
.cal-leg-dot{width:14px;height:10px;border-radius:2px}

/* 공통 */
.empty-msg{text-align:center;color:#ccc;font-size:12px;padding:30px 0}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <h1>🚖 애니콜택시 관리자</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="last-up" id="last-up"></span>
      <button class="btn-rfs" onclick="loadData()">↺ 새로고침</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="go(0)">확정대기 최신<span class="tc" id="cnt0">0</span></button>
    <button class="tab" onclick="go(1)">확정대기 오래된거<span class="tc" id="cnt1">0</span></button>
    <button class="tab" onclick="go(2)">당일배차방<span class="tc" id="cnt2">0</span></button>
    <button class="tab" onclick="go(3)">배차완료방<span class="tc" id="cnt3">0</span></button>
    <button class="tab" onclick="go(4)">달력</button>
  </div>
  <div class="tab-hdr" id="tab-hdr">① 확정대기 최신방</div>
  <div class="main" id="main">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px">불러오는 중...</div>
  </div>
</div>

<script>
// ── 상태 ──────────────────────────────
var allData = [];
var currentTab = 0;
var selectedCard = null;
var searchQuery = '';
var driverMap = {}; // {예약번호: {driver, kakao}}
var baechaText = '';
var rebTarget = null;
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();

var TAB_HDRS = [
  '① 확정대기 최신방',
  '② 확정대기 오래된방 (10분+ 경과 · 24시간 후 자동삭제)',
  '③ 당일 배차방',
  '④ 당일 배차완료방',
  '⑤ 달력 (날짜 클릭 → 해당 날짜 배차방)'
];

// ── 초기화 ────────────────────────────
function go(n) {
  currentTab = n;
  document.querySelectorAll('.tab').forEach(function(t,i){ t.className='tab'+(i===n?' on':''); });
  selectedCard = null; searchQuery = ''; rebTarget = null;
  render();
}

function loadData() {
  document.getElementById('main').innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px">불러오는 중...</div>';
  google.script.run
    .withSuccessHandler(function(raw) {
      if (!raw || raw.length < 2) { allData = []; render(); return; }
      var h = raw[0];
      allData = raw.slice(1).map(function(row, i) {
        var o = {}; h.forEach(function(k,j){ o[k] = String(row[j]||''); }); o._row = i+2; return o;
      }).filter(function(r){ return r['예약번호']; });
      document.getElementById('last-up').textContent = '최종: ' + new Date().toLocaleTimeString('ko-KR');
      autoMoveOld();
      render();
    })
    .withFailureHandler(function(e) {
      document.getElementById('main').innerHTML = '<div style="flex:1;text-align:center;padding:40px;color:#e05555">❌ 로드 실패: '+e.message+'</div>';
    })
    .getReservations();
}

function autoMoveOld() {
  var now = Date.now();
  allData.forEach(function(r) {
    if (r['상태'] !== '대기') return;
    var t = new Date(r['접수일시']).getTime();
    if (!isNaN(t) && (now-t) > 10*60*1000) {
      r['상태'] = '대기_오래됨';
      google.script.run.updateStatus(r._row, '대기_오래됨');
    }
  });
}

// ── 렌더 디스패처 ─────────────────────
function render() {
  updateCounts();
  document.getElementById('tab-hdr').textContent = TAB_HDRS[currentTab];
  var m = document.getElementById('main');
  m.innerHTML = '';
  if (currentTab===0||currentTab===1) renderConfirm(m);
  else if (currentTab===2) renderBaecha(m);
  else if (currentTab===3) renderBaechaComplete(m);
  else renderCalendar(m);
}

function updateCounts() {
  var c=[0,0,0,0];
  allData.forEach(function(r){
    var s=r['상태'];
    if(s==='대기')c[0]++;
    else if(s==='대기_오래됨')c[1]++;
    else if(s==='확정')c[2]++;
    else if(s==='배차완료'||s==='재배차완료')c[3]++;
  });
  for(var i=0;i<4;i++){var el=document.getElementById('cnt'+i);if(el)el.textContent=c[i];}
}

// ── 유틸 ──────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function tailLine(r,n){
  var t=r['꼬리']||'';
  var parts=t.split('\n');
  return parts[n]||'';
}

function cardLabel(r){
  var t=tailLine(r,0);
  if(t)return t;
  var dt=(r['탑승일시']||'').slice(5,16);
  return '['+dt+'] '+(r['출발지']||'').slice(0,15);
}

function fmtDt(dt){
  if(!dt)return{date:'',time:''};
  var m=dt.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
  if(!m)return{date:dt.slice(0,10),time:dt.slice(11,16)};
  var mo=parseInt(m[2]),d=parseInt(m[3]),h=parseInt(m[4]),mi=parseInt(m[5]);
  var ap=h<12?'오전':'오후', h2=h===0?12:(h>12?h-12:h);
  return{date:mo+'월 '+d+'일', time:ap+' '+h2+'시'+(mi>0?' '+mi+'분':'')};
}

function fmtElapsed(접수일시){
  var t=new Date(접수일시).getTime();
  if(isNaN(t))return'';
  var diff=Math.floor((Date.now()-t)/60000);
  return diff<60?diff+'분 경과':Math.floor(diff/60)+'시간 경과';
}

function elClass(접수일시){
  var t=new Date(접수일시).getTime();
  if(isNaN(t))return'e1';
  return Math.floor((Date.now()-t)/60000)>=60?'e2':'e1';
}

function bagStr(r){
  var cab=r['기내캐리어']||'',car=r['화물캐리어']||'',golf=r['골프백기타']||'';
  if(cab||car)return'화물 '+(car||'0')+'개 · 기내 '+(cab||'0')+'개';
  return'합산 '+(r['짐합산']||'0')+'개';
}

function getDups(r){
  var p=r['전화번호']||''; if(!p)return[];
  return allData.filter(function(x){return x['전화번호']===p&&x['예약번호']!==r['예약번호'];});
}

function safeKakaoId(r){
  var k=r['카카오ID']||'';
  return['대기','대기_오래됨','확정','배차완료','재배차완료'].includes(k)?'-':k;
}

// ══════════ 탭 4: 달력 ══════════
function renderCalendar(container){
  var yr=calYear, mo=calMonth;
  var firstDay=new Date(yr,mo,1).getDay();
  var lastDate=new Date(yr,mo+1,0).getDate();
  var today=new Date();

  var byDate={};
  allData.forEach(function(r){
    var dt=(r['탑승일시']||'').slice(0,10); if(!dt)return;
    if(!byDate[dt])byDate[dt]=[];
    byDate[dt].push(r);
  });

  var el=document.createElement('div'); el.className='cal-outer';
  var h='<div class="cal-wrap">';
  h+='<div class="cal-top"><div class="cal-title">'+yr+'년 '+(mo+1)+'월</div>';
  h+='<div><button class="cal-nav-btn" onclick="calPrev()">◀</button><button class="cal-nav-btn" onclick="calNext()">▶</button></div></div>';
  h+='<table class="cal"><tr>';
  ['일','월','화','수','목','금','토'].forEach(function(d){h+='<th>'+d+'</th>';});
  h+='</tr><tr>';

  for(var i=0;i<firstDay;i++)h+='<td></td>';
  var col=firstDay;
  for(var d=1;d<=lastDate;d++){
    var ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=(yr===today.getFullYear()&&mo===today.getMonth()&&d===today.getDate());
    var dow=new Date(yr,mo,d).getDay();
    var cls='cal-cell'+(isToday?' today':'')+(dow===0?' sun':'')+(dow===6?' sat':'');
    var calls=byDate[ds]||[];
    h+='<td class="'+cls+'" onclick="gotoDate(\''+ds+'\')">';
    h+='<div class="cal-day">'+d+'</div>';
    var shown=0;
    calls.forEach(function(r){
      if(shown>=3)return;
      var hasDrv=r['기사이름']?true:false;
      var lbl=(r['꼬리']||'').split('\n')[0]||(cardLabel(r).slice(0,10));
      if(hasDrv)lbl+=' '+r['기사이름'];
      h+='<div class="cal-entry '+(hasDrv?'done':'wait')+'">'+esc(lbl.slice(0,12))+'</div>';
      shown++;
    });
    if(calls.length>3)h+='<div class="cal-more">+'+(calls.length-3)+'건</div>';
    h+='</td>';
    col++;
    if(col===7&&d<lastDate){h+='</tr><tr>';col=0;}
  }
  h+='</tr></table>';
  h+='<div class="cal-legend">';
  h+='<div class="cal-leg"><div class="cal-leg-dot" style="background:#bbdefb"></div>배차대기</div>';
  h+='<div class="cal-leg"><div class="cal-leg-dot" style="background:#c8e6c9"></div>기사매칭완료</div>';
  h+='<div class="cal-leg"><div class="cal-leg-dot" style="background:#fff9e6;border:1px solid #ffe082"></div>오늘</div>';
  h+='</div></div>';
  el.innerHTML=h;
  container.appendChild(el);
}

function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}render();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}render();}
function gotoDate(dateStr){
  currentTab=2;
  document.querySelectorAll('.tab').forEach(function(t,i){t.className='tab'+(i===2?' on':'');});
  selectedCard=null; render();
}

function doBaechaCard(resNum){
  var r=allData.find(function(x){return x['예약번호']===resNum;});
  if(!r)return;
  var dm=driverMap[resNum]||{};
  if(!dm.driver){alert('기사 이름을 입력해주세요.');return;}
  google.script.run
    .withSuccessHandler(function(){loadData();})
    .updateStatus(r._row,'배차완료');
}

function doAutoMatch(){
  var ta=document.getElementById('baecha-ta');
  if(!ta)return;
  baechaText=ta.value;
  var confirmed=allData.filter(function(r){return r['상태']==='확정';});
  confirmed.sort(function(a,b){return(new Date(a['탑승일시']).getTime()||0)-(new Date(b['탑승일시']).getTime()||0);});
  ta.value.split('\n').forEach(function(line){
    var m=line.match(/^(\d+)[.\s]\s*(.+)/);
    if(!m)return;
    var num=parseInt(m[1]), name=m[2].trim();
    if(num>=701&&num<=700+confirmed.length){
      var r=confirmed[num-701];
      if(r){
        if(!driverMap[r['예약번호']])driverMap[r['예약번호']]={driver:'',kakao:''};
        driverMap[r['예약번호']].driver=name;
      }
    }
  });
  render();
}

function doResetMatch(){
  if(!confirm('매칭을 초기화할까요?'))return;
  driverMap={}; baechaText=''; render();
}

function doRebaecha(resNum){
  var r=allData.find(function(x){return x['예약번호']===resNum;});

}

function doCopy(elId,btnId,noteId){
  var el=document.getElementById(elId);
  if(!el)return;
  var text=el.tagName==='TEXTAREA'?el.value:el.innerText;
  var btn=document.getElementById(btnId);
  var note=document.getElementById(noteId);
  var done=function(){
    if(btn){btn.className='btn-copy done';btn.textContent='복사됨✓';}
    if(note)note.textContent='→ 복사후 사라짐';
    setTimeout(function(){if(btn){btn.className='btn-copy';btn.textContent='복사';}if(note)note.textContent='';},2000);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){fbCopy(text,done);});
  }else{fbCopy(text,done);}
}

function fbCopy(text,cb){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.cssText='position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(ta);
}
